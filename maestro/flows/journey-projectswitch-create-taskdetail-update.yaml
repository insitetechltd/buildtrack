# NOTE: Project names/seeds below assume Sprint7 sandbox project names. If developer re-seeded re-run with current preset after reseed: update projectA/projectB/projectC names.
# NOTE: Project picker entry uses tapOn "Change Project" — proven pattern from task-core-live-* flows (NOT profile-menu-project_picker testID).
appId: com.buildtrack.app.local
---
- evalScript: ${output.taskTitle = "QA03 Journey Create " + Math.floor(Date.now() / 1000)}
- evalScript: ${output.projectA = ".*Project A.*Commercial Building.*"}
- evalScript: ${output.projectB = ".*Project B.*"}
- evalScript: ${output.progressNote = "Progress bump " + Math.floor(Date.now() / 1000)}
- runFlow: bootstrap-live-manager-a.yaml
- assertVisible:
    id: "dashboard-screen__root"

# Project switch 1: Explicitly land on Project A first (proven text "Change Project" + text regex)
- tapOn:
    id: "app-screen-header__profile-trigger"
- tapOn: "Change Project"
- tapOn: ${output.projectA}
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 20000
- assertVisible:
    id: "dashboard-screen__root"

# Project switch 2: To Project B (second switch before journey continues — matches Planner spec)
- tapOn:
    id: "app-screen-header__profile-trigger"
- tapOn: "Change Project"
- tapOn: ${output.projectB}
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 20000
- assertVisible:
    id: "dashboard-screen__root"

# Tasks tab → Create entry → Save
- tapOn:
    id: "root-tab__tasks_pressable"
- runFlow:
    when:
      notVisible:
        id: "tasks-screen__task_list"
    commands:
      - tapOn:
          id: "root-tab__tasks_pressable"
          delay: 3000
- extendedWaitUntil:
    visible:
      id: "tasks-screen__task_list"
    timeout: 10000
- assertVisible:
    id: "tasks-screen__task_list"
- tapOn:
    id: "root-tab__camera_button"
- extendedWaitUntil:
    visible:
      id: "createTask-title"
    timeout: 8000
- assertVisible:
    id: "createTask-title"
- tapOn:
    id: "createTask-title"
- inputText: ${output.taskTitle}
- assertVisible: ${".*" + output.taskTitle + ".*"}
- tapOn:
    id: "createTask-description"
- inputText: "Created via M-QA-03 journey-projectswitch-create-taskdetail-update flow."
- tapOn:
    point: "50%, 18%"
- scrollUntilVisible:
    centerElement: true
    element:
      id: "create-task__submit-inline"
    direction: DOWN
- tapOn:
    id: "create-task__submit-inline"
- tapOn:
    id: "create-task__submit-inline"
    delay: 4000
- runFlow:
    when:
      visible:
        id: "create-task__submit-success-confirm"
    commands:
      - assertVisible:
          id: "create-task__submit-success-message"
      - tapOn:
          id: "create-task__submit-success-confirm"
- extendedWaitUntil:
    visible:
      id: "tasks-screen__task_list"
    timeout: 10000
- assertVisible:
    id: "tasks-screen__task_list"

# Tasks search → tap new task → Task Detail
- tapOn:
    id: "text-field:tasks-search__input"
- inputText: ${output.taskTitle}
- hideKeyboard
- assertVisible: ${".*" + output.taskTitle + ".*"}
- tapOn: ${".*" + output.taskTitle + ".*"}
- extendedWaitUntil:
    visible:
      id: "task-detail__bottom_action_bar"
    timeout: 10000
- assertVisible:
    id: "task-detail__bottom_action_bar"
- assertVisible: ${".*" + output.taskTitle + ".*"}

# Update Progress flow
- tapOn:
    id: "task-detail__quick-action-update_progress"
- extendedWaitUntil:
    visible:
      id: "update-progress__submit"
    timeout: 6000
- assertVisible: "Progress Update"
- tapOn:
    id: "update-progress__description"
- inputText: ${output.progressNote}
- assertVisible: ${".*" + output.progressNote + ".*"}
- hideKeyboard
- scrollUntilVisible:
    centerElement: true
    element:
      id: "update-progress__submit"
    direction: DOWN
- tapOn:
    id: "update-progress__submit"
- runFlow:
    when:
      visible: "Choose how you want to add photos"
    commands:
      - tapOn: "Cancel"
      - assertVisible:
          id: "update-progress__submit"
      - tapOn:
          id: "update-progress__submit"
- extendedWaitUntil:
    visible: ".*Progress update added successfully!.*"
    timeout: 8000
- assertVisible: ".*Progress update added successfully!.*"
- tapOn: "OK"
- extendedWaitUntil:
    visible:
      id: "task-detail__bottom_action_bar"
    timeout: 8000
- assertVisible:
    id: "task-detail__bottom_action_bar"
