# W-D07: 100% update then Submit for Review (Bob assignee; Sarah creator).
appId: com.buildtrack.app.local
tags:
  - w-d07
---
- runFlow: _boot-bob.yaml
- runFlow: _ensure-project.yaml
- runFlow: _seed-task-open-update.yaml
- runFlow: _open-library.yaml
- runFlow: ../create-task-photo/_pick-first.yaml
- runFlow: _confirm-selection.yaml
- scrollUntilVisible:
    centerElement: true
    element:
      id: "update-progress__completion-preset-100"
    direction: DOWN
- tapOn:
    id: "update-progress__completion-preset-100"
- tapOn:
    id: "update-progress__description"
- inputText: "Completed assigned checks for W-D07 submit-for-review."
- runFlow: ../_dismiss-keyboard.yaml
- tapOn: "Photos & Files"
- runFlow: ../_dismiss-keyboard.yaml
- scrollUntilVisible:
    centerElement: true
    element:
      id: "update-progress__submit"
    direction: DOWN
- tapOn:
    id: "update-progress__submit"
- tapOn:
    id: "update-progress__submit"
    delay: 1500
- runFlow:
    when:
      visible: ".*Task marked as 100% complete!.*"
    commands:
      - tapOn: "OK"
- runFlow:
    when:
      visible: ".*Progress update added successfully!.*"
    commands:
      - tapOn: "OK"
- extendedWaitUntil:
    visible:
      id: "task-detail__header_title"
    timeout: 15000
- scrollUntilVisible:
    centerElement: true
    element:
      id: "task-detail__quick-action-submit_review"
    direction: DOWN
- tapOn:
    id: "task-detail__quick-action-submit_review"
- waitForAnimationToEnd:
    timeout: 2500
- assertVisible: ".*Submitted For Review.*"
- takeScreenshot: "rc-E-W-D07-submitted"
