# Assert library shows exactly 2 prior selected (ledger invariant).
# Phase B: may be hybrid CaptureSession OR legacy InAppLibrary.
appId: com.buildtrack.app.local
---
# Wait for either hybrid or legacy grid
- runFlow:
    when:
      visible:
        id: "capture-session__library_grid"
    commands:
      - extendedWaitUntil:
          visible:
            id: "capture-session__library_grid"
          timeout: 8000
- runFlow:
    when:
      visible:
        id: "in-app-library__grid"
    commands:
      - extendedWaitUntil:
          visible:
            id: "in-app-library__grid"
          timeout: 8000
- assertVisible: ".*2 selected.*"
- takeScreenshot: "ct-photo-ledger-2-selected"
