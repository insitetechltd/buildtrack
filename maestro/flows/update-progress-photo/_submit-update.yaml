# Dock progress update: note + scrub toward 100% + send (Task Detail SoT).
appId: com.buildtrack.app.local
---
- evalScript: ${output.progressNote = "Maestro UP photo " + Date.now()}
# Photo dirt arms send; long-press remounts % scrub in trailing slot.
- longPressOn:
    id: "report-reply-composer__send"
- waitForAnimationToEnd:
    timeout: 800
- extendedWaitUntil:
    visible:
      id: "report-reply-composer__completion_hit"
    timeout: 4000
- swipe:
    start: "90%, 78%"
    end: "90%, 42%"
    duration: 800
- waitForAnimationToEnd:
    timeout: 800
- tapOn:
    id: "report-reply-composer__input"
- inputText: ${output.progressNote}
- runFlow: ../_dismiss-keyboard.yaml
- tapOn:
    id: "report-reply-composer__send"
- waitForAnimationToEnd:
    timeout: 4000
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
- runFlow:
    when:
      visible: "Success"
    commands:
      - tapOn: "OK"
- runFlow:
    when:
      visible: ".*Progress update.*"
    commands:
      - tapOn: "OK"
- runFlow: ../create-task-photo/_assert-no-logbox.yaml
