# NOTE: Project names/seeds match Sprint7 preset A actual: 2 seeded projects. Display: "Shared Harbor Tower" (id: sprint7-project-shared-harbor-tower) and "Tristan Private Fitout" (id: sprint7-project-tristan-private-fitout). Matches 2026-08-07_094247 screen-hierarchy step-019.
# NOTE: Project picker entry uses profile-menu-project_picker testID. Rows use S-UX-01I testIDs `project-picker__row-${projectId}` (commit 145282e). 2 project row taps use id directly — no text scroll.
# NOTE: Exemptions documented inline:
#   1× EXEMPT DYNAMIC TAP (line ~156): Tasks-list row tap of dynamically-created UUID task. taskId is not exposed to Maestro evalScript; TESTID_GAPS_TODO.md row 17 uses pattern `tasks-screen__row_${taskId}` but the runtime UUID cannot be known at evalScript time. This single regex tap is structurally required and is not a selector drift risk (content assertion matches timestamped unique title).
#   4× PLATFORM_LIMITATION taps (TESTID_GAPS_TODO.md rows 21-24 = PLATFORM_LIMITATION — native Alert.alert chrome carries no testID prop in React Native):
#     - Photo picker sheet title "Choose how you want to add photos" + button "Cancel" (navigating around upload path)
#     - Progress-update success body message regex ".*Progress update added successfully!.*" + button "OK"
# NOTE: Starts with plain launchApp (no bootstrap / clearState) because sprint7-initialize-sandbox flow (executed earlier in the D7 suite) already signed in Manager A and reseeded. Keeping clearState:true ONLY in the first bootstrap flow of a session avoids repeated reinstall-clears breaking iOS dev-client routing between flows in the same Maestro suite.
appId: com.buildtrack.app.local
---
- evalScript: ${output.taskTitle = "QA03 Journey Create " + Math.floor(Date.now() / 1000)}
- evalScript: ${output.projectA = "Shared Harbor Tower"}
- evalScript: ${output.projectB = "Tristan Private Fitout"}
- evalScript: ${output.progressNote = "Progress bump " + Math.floor(Date.now() / 1000)}
- evalScript: ${output.projectAId = "sprint7-project-shared-harbor-tower"}
- evalScript: ${output.projectBId = "sprint7-project-tristan-private-fitout"}
- launchApp:
    appId: "com.buildtrack.app.local"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "login-submit"
    commands:
      - tapOn:
          id: "login-emailOrPhone"
      - inputText: "john.managera@test.com"
      - tapOn:
          id: "login-password"
      - inputText: "password123"
      - tapOn:
          id: "login-submit"
      - extendedWaitUntil:
          visible:
            id: "dashboard-screen__root"
          timeout: 30000
- assertVisible:
    id: "dashboard-screen__root"

# Project switch 1: Explicitly land on Shared Harbor Tower first (id-based project-picker row, 2 seeded projects fit viewport so scrollBeforeTap not needed)
- tapOn:
    id: "app-screen-header__profile-trigger"
- extendedWaitUntil:
    visible:
      id: "profile-menu-project_picker"
    timeout: 5000
- tapOn:
    id: "profile-menu-project_picker"
- extendedWaitUntil:
    visible:
      id: "projectPicker-scroll"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "project-picker__row-sprint7-project-shared-harbor-tower"
    timeout: 8000
- tapOn:
    id: "project-picker__row-sprint7-project-shared-harbor-tower"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 20000
- assertVisible:
    id: "dashboard-screen__root"

# Project switch 2: To Tristan Private Fitout (id-based row tap; proves 2nd project switch before create — matches scope intent)
- tapOn:
    id: "app-screen-header__profile-trigger"
- extendedWaitUntil:
    visible:
      id: "profile-menu-project_picker"
    timeout: 5000
- tapOn:
    id: "profile-menu-project_picker"
- extendedWaitUntil:
    visible:
      id: "projectPicker-scroll"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "project-picker__row-sprint7-project-tristan-private-fitout"
    timeout: 8000
- tapOn:
    id: "project-picker__row-sprint7-project-tristan-private-fitout"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 20000
- assertVisible:
    id: "dashboard-screen__root"

# Tasks tab → Create entry → Save
- tapOn:
    id: "root-tab__tasks_pressable"
- runFlow:
    when:
      notVisible:
        id: "tasks-screen__task_list"
    commands:
      - tapOn:
          id: "root-tab__tasks_pressable"
          delay: 3000
- extendedWaitUntil:
    visible:
      id: "tasks-screen__task_list"
    timeout: 10000
- assertVisible:
    id: "tasks-screen__task_list"
- tapOn:
    id: "root-tab__camera_button"
- extendedWaitUntil:
    visible:
      id: "createTask-title"
    timeout: 8000
- assertVisible:
    id: "createTask-title"
- tapOn:
    id: "createTask-title"
- inputText: ${output.taskTitle}
# S-UX-01I gap P1: task-title inside create-task__field_title--preview wrapper View assert visible (replaces bare text regex for copy-proofing)
- assertVisible:
    id: "create-task__field_title--preview"
- tapOn:
    id: "createTask-description"
- inputText: "Created via M-QA-03 journey-projectswitch-create-taskdetail-update flow."
- tapOn:
    point: "50%, 18%"
- scrollUntilVisible:
    centerElement: true
    element:
      id: "create-task__submit-inline"
    direction: DOWN
- tapOn:
    id: "create-task__submit-inline"
- tapOn:
    id: "create-task__submit-inline"
    delay: 4000
- runFlow:
    when:
      visible:
        id: "create-task__submit-success-confirm"
    commands:
      - assertVisible:
          id: "create-task__submit-success-message"
      - tapOn:
          id: "create-task__submit-success-confirm"
- extendedWaitUntil:
    visible:
      id: "tasks-screen__task_list"
    timeout: 10000
- assertVisible:
    id: "tasks-screen__task_list"

# Tasks search → tap new task → Task Detail
# NOTE (Exempt 1× DYNAMIC TAP): task-row tap uses regex because created taskId is a runtime UUID NOT captured in journey evalScript output. Title uses Date.now() so uniqueness is guaranteed across re-runs. TESTID_GAPS_TODO.md row 17 pattern `tasks-screen__row_${taskId}` requires the runtime taskId.
- tapOn:
    id: "text-field:tasks-search__input"
- inputText: ${output.taskTitle}
- hideKeyboard
- assertVisible: ${".*" + output.taskTitle + ".*"}
- tapOn: ${".*" + output.taskTitle + ".*"}
- extendedWaitUntil:
    visible:
      id: "task-detail__bottom_action_bar"
    timeout: 10000
- assertVisible:
    id: "task-detail__bottom_action_bar"
# P1 gap C3: task-detail__header_title visible (title node Text carries testID; replaces text regex)
- assertVisible:
    id: "task-detail__header_title"

# Update Progress flow
- tapOn:
    id: "task-detail__quick-action-update_progress"
- extendedWaitUntil:
    visible:
      id: "update-progress__submit"
    timeout: 6000
# P1 gap row 19: update-progress__screen_title explicit id on titleNode replaces header text regex
- assertVisible:
    id: "update-progress__screen_title"
- tapOn:
    id: "update-progress__description"
- inputText: ${output.progressNote}
# P1 gap row 20: update-progress__description--preview preview wrapper TextInput id assert replaces text regex
- assertVisible:
    id: "update-progress__description--preview"
- hideKeyboard
- scrollUntilVisible:
    centerElement: true
    element:
      id: "update-progress__submit"
    direction: DOWN
- tapOn:
    id: "update-progress__submit"
# PLATFORM_LIMITATION (TESTID_GAPS_TODO.md rows 21 + 22): "Choose how you want to add photos" + "Cancel" are native Alert.alert body + button. No RN testID possible. Inline contract: skip photo path by tapping Cancel when the alert is visible, then re-submit progress.
- runFlow:
    when:
      visible: "Choose how you want to add photos"
    commands:
      - tapOn: "Cancel"
      - assertVisible:
          id: "update-progress__submit"
      - tapOn:
          id: "update-progress__submit"
# PLATFORM_LIMITATION (TESTID_GAPS_TODO.md rows 23 + 24): success toast body + "OK" are inside native Alert.alert. No RN testID. Inline contract: match via text only.
- extendedWaitUntil:
    visible: ".*Progress update added successfully!.*"
    timeout: 8000
- assertVisible: ".*Progress update added successfully!.*"
- tapOn: "OK"
- extendedWaitUntil:
    visible:
      id: "task-detail__bottom_action_bar"
    timeout: 8000
- assertVisible:
    id: "task-detail__bottom_action_bar"
