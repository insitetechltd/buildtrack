# Open Create Task with ≥1 photo via capture-first camera tab.
# Leaves caller on create-task__continuous_form (attachments present).
# Camera FAB → CaptureSession → library peek → Accept → Assign → Create form.
# Photos fixtures: scripts/maestro/ensure-create-task-photo-media.sh only.
appId: com.buildtrack.app.local
---
- runFlow:
    when:
      visible: "Choose how you want to add photos"
    commands:
      - tapOn: "Cancel"
- repeat:
    times: 4
    commands:
      - tapOn:
          text: "Dismiss"
          optional: true
- runFlow:
    when:
      visible:
        id: "root-tab__camera_icon_surface"
    commands:
      - tapOn:
          id: "root-tab__camera_icon_surface"
      - waitForAnimationToEnd:
          timeout: 2500
- tapOn:
    text: "Dismiss"
    optional: true
- extendedWaitUntil:
    visible:
      id: "capture-session__camera"
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "capture-session__library_peek"
    commands:
      - tapOn:
          id: "capture-session__library_peek"
- runFlow:
    when:
      visible:
        id: "capture-session__open_library_fallback"
    commands:
      - tapOn:
          id: "capture-session__open_library_fallback"
- extendedWaitUntil:
    visible:
      id: "capture-session__hybrid_library"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "capture-session__library_grid"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    point: "17%, 28%"
- waitForAnimationToEnd:
    timeout: 1000
- runFlow:
    when:
      notVisible: ".*[1-9] selected.*"
    commands:
      - tapOn:
          point: "17%, 22%"
- extendedWaitUntil:
    visible: ".*[1-9] selected.*"
    timeout: 10000
- tapOn:
    id: "capture-session__hybrid_accept"
- extendedWaitUntil:
    visible:
      id: "photo-selection__confirm"
    timeout: 25000
- tapOn:
    id: "photo-selection__confirm"
- runFlow:
    when:
      visible: ".*Assign.*"
    commands:
      - tapOn: ".*Assign.*"
- runFlow:
    when:
      visible:
        id: "create-task__post_capture_routing_sheet"
    commands:
      - tapOn:
          id: "create-task__routing_choice_create"
- runFlow:
    when:
      visible: "Create Task"
    commands:
      - tapOn: "Create Task"
- extendedWaitUntil:
    visible:
      id: "create-task__continuous_form"
    timeout: 25000
- assertVisible:
    id: "create-task__attachments_section"
- runFlow: _assert-no-logbox.yaml
