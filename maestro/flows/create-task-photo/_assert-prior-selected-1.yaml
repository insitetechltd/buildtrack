# Assert library shows exactly 1 prior selected (ledger invariant).
# Phase B: may be hybrid CaptureSession OR legacy InAppLibrary.
appId: com.buildtrack.app.local
---
# Wait for either hybrid or legacy grid
- runFlow:
    when:
      visible:
        id: "capture-session__library_grid"
    commands:
      - extendedWaitUntil:
          visible:
            id: "capture-session__library_grid"
          timeout: 8000
      # Hybrid: wait for selectedCount to sync (title updates from "Select photos" to "1 selected")
      - extendedWaitUntil:
          visible: ".*1 selected.*"
          timeout: 5000
- runFlow:
    when:
      visible:
        id: "in-app-library__grid"
    commands:
      - extendedWaitUntil:
          visible:
            id: "in-app-library__grid"
          timeout: 8000
      - assertVisible: ".*1 selected.*"
- takeScreenshot: "ct-photo-ledger-1-selected"
