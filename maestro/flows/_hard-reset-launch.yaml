# Intentional hard reset: sign out first (M-DATA-04 Realtime teardown), then clearState.
# Use for first-install / TCC / post-sandbox container wipe — NOT ordinary day-to-day boots.
appId: com.buildtrack.app.local
---
- launchApp:
    clearState: false
    stopApp: false
    permissions:
      photos: allow
      medialibrary: allow
      camera: allow
      notifications: deny
- runFlow: _dismiss-blocking-overlays.yaml
- runFlow:
    when:
      notVisible:
        id: "login-submit"
    commands:
      - runFlow: _logout.yaml
- launchApp:
    clearState: true
    permissions:
      photos: allow
      medialibrary: allow
      camera: allow
      notifications: deny
