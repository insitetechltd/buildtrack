# Ordinary day-to-day boot (John): no clearState.
# Always land as John: if another session is live (Erin after org S3, Carol, etc.), logout first.
# Tier policy: clearState only for intentional first-install / TCC / sandbox-reset flows.
appId: com.buildtrack.app.local
---
- launchApp:
    clearState: false
    permissions:
      photos: allow
      medialibrary: allow
      camera: allow
      notifications: deny
- runFlow: ../_dismiss-blocking-overlays.yaml
- runFlow:
    when:
      notVisible:
        id: "login-submit"
    commands:
      - runFlow: ../_logout.yaml
- extendedWaitUntil:
    visible:
      id: "login-submit"
    timeout: 45000
- tapOn:
    id: "^login-emailOrPhone$"
- eraseText
- inputText: "john.managera@test.com"
- tapOn:
    id: "^login-password$"
- eraseText
- inputText: "password123"
- tapOn:
    id: "login-submit"
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"
- runFlow:
    when:
      visible:
        id: "admin-overview-hero"
    commands:
      - tapOn:
          id: "root-tab__activity"
- tapOn:
    text: "Not Now"
    optional: true
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 45000
- runFlow: _assert-no-logbox.yaml
- extendedWaitUntil:
    visible:
      id: "root-tab__camera_icon_surface"
    timeout: 10000
