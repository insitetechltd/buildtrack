# Resume remaining Joe store frames if already on Task Detail as Joe.
appId: com.buildtrack.app.local
---
- launchApp:
    clearState: false
- tapOn:
    id: "capture-session__cancel"
    optional: true
- tapOn:
    id: "app-screen-header__back"
    optional: true
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    id: "root-tab__tasks_pressable"
- extendedWaitUntil:
    visible:
      id: "tasks-screen__root"
    timeout: 30000
- takeScreenshot: "mkt-03-tasks"
- tapOn:
    id: "app-screen-header__profile-trigger"
- waitForAnimationToEnd:
    timeout: 1500
- runFlow:
    when:
      visible:
        id: "profile-menu-company_admin"
    commands:
      - tapOn:
          id: "profile-menu-company_admin"
      - waitForAnimationToEnd:
          timeout: 4000
      - takeScreenshot: "mkt-05-company"
- tapOn:
    id: "root-tab__activity"
    optional: true
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "root-tab__camera_icon_surface"
- waitForAnimationToEnd:
    timeout: 4000
- takeScreenshot: "mkt-02-create-or-capture"
- tapOn:
    id: "capture-session__cancel"
    optional: true
