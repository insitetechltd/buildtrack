# Confirm Select Photos → back on Task Detail progress dock with photos.
appId: com.buildtrack.app.local
---
- tapOn:
    id: "photo-selection__confirm"
- extendedWaitUntil:
    visible:
      id: "report-reply-composer"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "report-reply-composer__photo"
    timeout: 8000
- runFlow: ../create-task-photo/_assert-no-logbox.yaml
