# DU-H01 phase 2 — John creates task with photo, assigns Alice.
#
# Optimal path (each step COMPLETE or FAIL — no soft skip of required gates):
#   1. resume John stopApp:false     REQUIRED (keep session; no quit-without-logout)
#   2. ensure Project A              REQUIRED (empty team list if skipped/wrong project)
#   3. open create + photo           REQUIRED
#   4. assign Alice                  REQUIRED (needs project team loaded)
#   5. submit with title             REQUIRED
# NOT here: pull-to-refresh after login; launchApp stop/clear mid-gate.
appId: com.buildtrack.app.local
tags:
  - dual-user
  - du-h01
---
- runFlow: _resume-john.yaml
- runFlow: _ensure-project.yaml
- runFlow: ../_dismiss-blocking-overlays.yaml
- tapOn:
    id: "root-tab__camera_icon_surface"
- waitForAnimationToEnd:
    timeout: 2500
- tapOn:
    text: "Dismiss"
    optional: true
- extendedWaitUntil:
    visible:
      id: "create-task__continuous_form"
    timeout: 25000
- runFlow: ../create-task-photo/_open-library.yaml
- runFlow: ../create-task-photo/_pick-first.yaml
- runFlow: ../create-task-photo/_confirm-selection.yaml
- takeScreenshot: "du-h01-03-john-form-with-photo"
- runFlow: _assign-alice.yaml
- takeScreenshot: "du-h01-04-john-assign-alice"
- runFlow: _submit-create-with-title.yaml
- takeScreenshot: "du-h01-05-john-created"
