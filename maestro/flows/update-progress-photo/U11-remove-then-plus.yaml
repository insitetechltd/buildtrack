# U11 — Remove on Select Photos then form + ledger (maps P18/P19)
appId: com.buildtrack.app.local
tags:
  - update-progress-photo
  - u11
---
- evalScript: ${output.permutation = "U11"}
- runFlow: _boot.yaml
- runFlow: _ensure-project.yaml
- runFlow: _seed-task-open-update.yaml
- runFlow: _open-library.yaml
- runFlow: ../create-task-photo/_pick-slot-0.yaml
- extendedWaitUntil:
    visible: ".*1 selected.*"
    timeout: 8000
- runFlow: ../create-task-photo/_pick-slot-1.yaml
- extendedWaitUntil:
    visible: ".*2 selected.*"
    timeout: 8000
- runFlow: ../create-task-photo/_accept-library.yaml
- assertVisible:
    id: "photo-selection__tile_1"
- tapOn:
    id: "photo-selection__tile_0"
- tapOn:
    id: "photo-selection__preview_remove"
- tapOn: "Remove"
- extendedWaitUntil:
    visible:
      id: "photo-selection__confirm"
    timeout: 6000
- assertVisible:
    id: "photo-selection__tile_0"
- runFlow: _confirm-selection.yaml
- runFlow: _reopen-library-from-form.yaml
- runFlow: ../create-task-photo/_assert-prior-selected-1.yaml
- runFlow: _cancel-library-to-update.yaml
- runFlow: _submit-update.yaml
- takeScreenshot: "up-U11-done"
