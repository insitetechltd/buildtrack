# W-T05: Pull-to-refresh on the Tasks list (operator pull only).
# Native RefreshControl only fires from the top of the list ScrollView.
# Do not tap after landing — stay at y=0. Header refresh icon is filter-reset, not this.
appId: com.buildtrack.app.local
tags:
  - rc-headed-d05
---
- runFlow: ../create-task-photo/_boot.yaml
- runFlow: ../create-task-photo/_ensure-project.yaml
- runFlow: ../_dismiss-blocking-overlays.yaml

- tapOn:
    id: "root-tab__tasks_pressable"
- extendedWaitUntil:
    visible:
      id: "tasks-screen__root"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "tasks-screen__task_list"
    timeout: 25000
- takeScreenshot: "rc-D-T05-before-pull"

# Pull from the list body (below search), not the header.
# Vertical-only: row Swipeable fails Y so RefreshControl can rubber-band.
- swipe:
    start: "50%, 28%"
    end: "50%, 78%"
    duration: 1200
- takeScreenshot: "rc-D-T05-refreshing"
- waitForAnimationToEnd:
    timeout: 4000
- extendedWaitUntil:
    visible:
      id: "tasks-screen__task_list"
    timeout: 15000
- assertVisible:
    id: "tasks-screen__search_section"
- takeScreenshot: "rc-D-T05-after-pull"
