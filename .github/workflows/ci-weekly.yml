name: CI Weekly

on:
  schedule:
    - cron: '0 3 * * 0'

permissions:
  contents: read

concurrency:
  group: ci-weekly-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  weekly-coverage-and-smoke:
    name: Weekly Coverage And Smoke
    runs-on: ubuntu-latest
    timeout-minutes: 45
    env:
      CI: true
      # Keep placeholders in place for future environment-aware test expansion.
      # Override with repo Variables or Secrets if weekly coverage begins using
      # non-mocked backends or Expo configuration.
      EXPO_PUBLIC_SUPABASE_URL: ${{ vars.EXPO_PUBLIC_SUPABASE_URL || 'https://example.supabase.co' }}
      EXPO_PUBLIC_SUPABASE_ANON_KEY: ${{ secrets.EXPO_PUBLIC_SUPABASE_ANON_KEY || 'ci-placeholder-anon-key' }}
      EXPO_NO_DOTENV: true

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci --legacy-peer-deps

      - name: Weekly coverage run
        run: npm run test:coverage

      - name: Upload Jest coverage artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: jest-coverage-report
          path: coverage/
          if-no-files-found: warn
