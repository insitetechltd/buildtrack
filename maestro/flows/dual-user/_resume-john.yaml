# Bring John to foreground WITHOUT stopping the app.
# M-DATA-04: launchApp defaults to stopApp:true (quit without logout) — never do that mid-gate.
appId: com.buildtrack.app.local
---
- launchApp:
    clearState: false
    stopApp: false
    permissions:
      photos: allow
      medialibrary: allow
      camera: allow
      notifications: deny
- runFlow: ../_dismiss-blocking-overlays.yaml
# Live session must already be on Activity/Tasks. Re-login only if somehow on login.
- runFlow:
    when:
      visible:
        id: "login-submit"
    commands:
      - tapOn:
          id: "^login-emailOrPhone$"
      - inputText: "john.managera@test.com"
      - tapOn:
          id: "^login-password$"
      - inputText: "password123"
      - tapOn:
          id: "login-submit"
      - runFlow:
          when:
            visible: "Save Password?"
          commands:
            - tapOn: "Not Now"
- extendedWaitUntil:
    visible:
      id: "app-screen-header__profile-trigger"
    timeout: 45000
- runFlow: ../create-task-photo/_assert-no-logbox.yaml
