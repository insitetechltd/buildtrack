# Dual-user: land on shared Project A before any create/assign.
# REQUIRED: Project A active (team roster depends on it — empty assignee list = wrong/no project).
# REMOVED: pull-to-refresh after login (unnecessary; churns Realtime).
appId: com.buildtrack.app.local
---
- runFlow: ../_dismiss-blocking-overlays.yaml
- tapOn:
    id: "root-tab__activity"
    optional: true
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 20000
# If Project A is not the active project, open picker and select by stable row id.
- runFlow:
    when:
      notVisible: ".*Project A - Commercial Building.*"
    commands:
      - tapOn:
          id: "app-screen-header__profile-trigger"
      - waitForAnimationToEnd:
          timeout: 1500
      - extendedWaitUntil:
          visible:
            id: "profile-menu-project_picker"
          timeout: 12000
      - tapOn:
          id: "profile-menu-project_picker"
      - extendedWaitUntil:
          visible:
            id: "projectPicker-scroll"
          timeout: 12000
      - tapOn:
          id: "project-picker__row-d032c44b-3146-4c3b-8ba3-46a3091dca1e"
      - extendedWaitUntil:
          visible:
            id: "dashboard-screen__root"
          timeout: 45000
# Hard gate: wrong project → fail here (do not skip).
- extendedWaitUntil:
    visible: ".*Project A - Commercial Building.*"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__project_summary_section"
    timeout: 20000
- assertVisible: ".*Project A - Commercial Building.*"
- takeScreenshot: "du-active-project-project-a"
- runFlow: ../create-task-photo/_assert-no-logbox.yaml
