# W-T02: Tasks row opens Task Detail.
# Do not tap after typing search — that edits the query.
appId: com.buildtrack.app.local
tags:
  - rc-headed-d02
---
- runFlow: ../create-task-photo/_boot.yaml
- runFlow: ../create-task-photo/_ensure-project.yaml
- runFlow: ../_dismiss-blocking-overlays.yaml

- tapOn:
    id: "root-tab__tasks_pressable"
- extendedWaitUntil:
    visible:
      id: "tasks-screen__root"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "tasks-screen__task_list"
    timeout: 25000

- tapOn:
    id: "tasks-screen__header_reset_filters"
    optional: true
- waitForAnimationToEnd:
    timeout: 800
- tapOn:
    id: "text-field:tasks-search__input"
- eraseText
- inputText: "Maestro CT Photo"
- waitForAnimationToEnd:
    timeout: 1500
- takeScreenshot: "rc-D-T02-search"
- extendedWaitUntil:
    visible: ".*Maestro CT Photo.*NEW"
    timeout: 20000
- tapOn:
    text: ".*Maestro CT Photo.*NEW"
- runFlow:
    when:
      notVisible:
        id: "task-detail__header_title"
    commands:
      - tapOn:
          text: ".*Maestro CT Photo.*NEW"
          delay: 1500
- extendedWaitUntil:
    visible:
      id: "task-detail__header_title"
    timeout: 12000
- takeScreenshot: "rc-D-T02-task-detail"
