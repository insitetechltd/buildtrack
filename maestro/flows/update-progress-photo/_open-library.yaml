# From Task Detail dock: photo → CaptureSession library peek → grid ready.
# Sims: never shutter. Leaves caller on hybrid library for pick helpers.
appId: com.buildtrack.app.local
---
- tapOn:
    id: "report-reply-composer__photo"
- runFlow:
    when:
      visible: "Choose from Library"
    commands:
      - tapOn: "Choose from Library"
- runFlow:
    when:
      visible:
        id: "capture-session__camera"
    commands:
      - runFlow:
          when:
            visible:
              id: "capture-session__library_peek"
          commands:
            - tapOn:
                id: "capture-session__library_peek"
      - runFlow:
          when:
            visible:
              id: "capture-session__open_library_fallback"
          commands:
            - tapOn:
                id: "capture-session__open_library_fallback"
- extendedWaitUntil:
    visible:
      id: "capture-session__hybrid_library"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "capture-session__library_grid"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 2000
