appId: com.buildtrack.app.local
---
- launchApp:
    appId: "com.buildtrack.app.local"
- extendedWaitUntil:
    visible:
      id: "app-screen-header__profile-trigger"
    timeout: 90000
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible:
        id: "root-tab__activity"
    commands:
      - tapOn:
          id: "root-tab__activity"
      - waitForAnimationToEnd:
          timeout: 2500
- assertVisible:
    id: "app-screen-header__profile-trigger"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    id: "app-screen-header__profile-trigger"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "profile-menu-developer_settings"
    timeout: 20000
- assertVisible:
    id: "profile-menu-developer_settings"
- tapOn:
    id: "profile-menu-developer_settings"
- extendedWaitUntil:
    visible:
      id: "developer-settings-screen__root"
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- assertVisible:
    id: "developer-settings-screen__root"
- scrollUntilVisible:
    element:
      id: "developer-settings-action_initialize-sprint7-sandbox"
    direction: DOWN
    speed: 40
    visibilityPercentage: 50
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 2500
- extendedWaitUntil:
    visible:
      id: "developer-settings-action_initialize-sprint7-sandbox"
    timeout: 12000
- assertVisible:
    id: "developer-settings-action_initialize-sprint7-sandbox"
- tapOn:
    id: "developer-settings-action_initialize-sprint7-sandbox"
- waitForAnimationToEnd:
    timeout: 8000
- extendedWaitUntil:
    visible:
      id: "developer-settings__preset_b"
    timeout: 25000
- runFlow:
    when:
      notVisible:
        id: "developer-settings__preset_b"
    commands:
      - runFlow:
          when:
            visible:
              id: "developer-settings-sheet_confirm-sprint7"
          commands:
            - waitForAnimationToEnd:
                timeout: 2500
            - extendedWaitUntil:
                visible:
                  id: "developer-settings-sheet_confirm-sprint7_initialize-tristan"
                timeout: 15000
            - tapOn:
                id: "developer-settings-sheet_confirm-sprint7_initialize-tristan"
            - waitForAnimationToEnd:
                timeout: 4000
            - extendedWaitUntil:
                visible:
                  id: "developer-settings-sheet_info-sprint7"
                timeout: 30000
            - waitForAnimationToEnd:
                timeout: 3000
            - extendedWaitUntil:
                visible:
                  id: "developer-settings-sheet_info-sprint7_ok"
                timeout: 15000
            - tapOn:
                id: "developer-settings-sheet_info-sprint7_ok"
            - waitForAnimationToEnd:
                timeout: 5000
      - runFlow:
          when:
            visible:
              id: "developer-settings-sheet_info-sprint7"
          commands:
            - extendedWaitUntil:
                visible:
                  id: "developer-settings-sheet_info-sprint7_ok"
                timeout: 15000
            - tapOn:
                id: "developer-settings-sheet_info-sprint7_ok"
            - waitForAnimationToEnd:
                timeout: 5000
      - scrollUntilVisible:
          element:
            id: "developer-settings__preset_b"
          direction: DOWN
          speed: 40
          visibilityPercentage: 50
          timeout: 20000
      - extendedWaitUntil:
          visible:
            id: "developer-settings__preset_b"
          timeout: 15000
- assertVisible:
    id: "developer-settings__preset_b"
- scrollUntilVisible:
    element:
      id: "developer-settings__preset_b"
    direction: DOWN
    speed: 40
    visibilityPercentage: 50
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 1500
- assertVisible:
    id: "developer-settings__preset_b"
- tapOn:
    id: "developer-settings__preset_b"
- waitForAnimationToEnd:
    timeout: 3500
- runFlow:
    when:
      visible:
        id: "developer-settings-sheet_info-sprint7"
    commands:
      - waitForAnimationToEnd:
          timeout: 2500
      - extendedWaitUntil:
          visible:
            id: "developer-settings-sheet_info-sprint7_ok"
          timeout: 20000
      - tapOn:
          id: "developer-settings-sheet_info-sprint7_ok"
      - waitForAnimationToEnd:
          timeout: 4500
- runFlow:
    when:
      visible:
        id: "developer-settings-sheet_info-sprint7"
    commands:
      - waitForAnimationToEnd:
          timeout: 2500
      - extendedWaitUntil:
          visible:
            id: "developer-settings-sheet_info-sprint7_ok"
          timeout: 20000
      - tapOn:
          id: "developer-settings-sheet_info-sprint7_ok"
      - waitForAnimationToEnd:
          timeout: 4500
- runFlow:
    when:
      visible:
        id: "developer-settings-sheet_confirm-sprint7"
    commands:
      - waitForAnimationToEnd:
          timeout: 1500
      - back
      - waitForAnimationToEnd:
          timeout: 2000
- runFlow:
    when:
      visible:
        id: "profile-menu__backdrop"
    commands:
      - tapOn:
          id: "profile-menu__backdrop"
      - waitForAnimationToEnd:
          timeout: 1500
- launchApp:
    appId: "com.buildtrack.app.local"
    clearState: true
- extendedWaitUntil:
    visible:
      id: "app-screen-header__profile-trigger"
    timeout: 180000
- assertVisible:
    id: "app-screen-header__profile-trigger"
- waitForAnimationToEnd:
    timeout: 5000
- runFlow:
    when:
      visible:
        id: "root-tab__activity"
    commands:
      - tapOn:
          id: "root-tab__activity"
      - waitForAnimationToEnd:
          timeout: 3000
- assertVisible:
    id: "app-screen-header__profile-trigger"
- takeScreenshot:
    path: "qa01-b-01-dashboard-overdue-queue"

- tapOn:
    point: "96%, 97%"
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    point: "96%, 97%"
- waitForAnimationToEnd:
    timeout: 1500
- extendedWaitUntil:
    visible:
      id: "root-tab__tasks"
    timeout: 20000
- tapOn:
    id: "root-tab__tasks"
- waitForAnimationToEnd:
    timeout: 5000
- extendedWaitUntil:
    visible:
      id: "tasks-screen__search_section"
    timeout: 15000
- runFlow:
    when:
      notVisible:
        id: "tasks-screen__search_section"
    commands:
      - tapOn:
          id: "root-tab__tasks"
      - waitForAnimationToEnd:
          timeout: 5000
      - extendedWaitUntil:
          visible:
            id: "tasks-screen__search_section"
          timeout: 15000
- runFlow:
    when:
      notVisible:
        id: "tasks-screen__search_section"
    commands:
      - tapOn:
          text: "Tasks"
      - waitForAnimationToEnd:
          timeout: 6000
      - extendedWaitUntil:
          visible:
            id: "tasks-screen__search_section"
          timeout: 15000
- assertVisible:
    id: "tasks-screen__search_section"
- takeScreenshot:
    path: "qa01-b-02-tasks-overdue-list"

- runFlow:
    when:
      visible:
        id: "root-tab__activity"
    commands:
      - tapOn:
          id: "root-tab__activity"
      - waitForAnimationToEnd:
          timeout: 3500
- extendedWaitUntil:
    visible:
      id: "root-tab__activity"
    timeout: 15000
- runFlow:
    when:
      notVisible:
        id: "root-tab__activity"
    commands:
      - tapOn:
          point: "4%, 97%"
      - waitForAnimationToEnd:
          timeout: 3000
- assertVisible:
    id: "app-screen-header__profile-trigger"
- waitForAnimationToEnd:
    timeout: 2500
- scrollUntilVisible:
    element:
      text: "Recent Activity"
    direction: DOWN
    speed: 40
    visibilityPercentage: 50
    timeout: 20000
- waitForAnimationToEnd:
    timeout: 2000
- takeScreenshot:
    path: "qa01-b-03-dashboard-queue-overview-crunch"
