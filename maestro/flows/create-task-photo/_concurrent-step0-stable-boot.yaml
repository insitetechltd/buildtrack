# Concurrent coaching — Step 0: ordinary no-clear boot (no exp+ openLink; sim -10814).
# Resume session when live; login only if needed. Assert no permission-denied LogBox.
appId: com.buildtrack.app.local
---
- launchApp:
    clearState: false
    permissions:
      photos: allow
      medialibrary: allow
      camera: allow
      notifications: deny
- runFlow:
    when:
      visible:
        id: "login-submit"
    commands:
      - tapOn:
          id: "login-emailOrPhone"
      - inputText: "john.managera@test.com"
      - tapOn:
          id: "login-password"
      - inputText: "password123"
      - tapOn:
          id: "login-submit"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 45000
- runFlow:
    when:
      visible: "Console Error"
    commands:
      - assertVisible:
          id: "boot-must-not-show-console-error"
- runFlow:
    when:
      visible: ".*permission denied for table.*"
    commands:
      - assertVisible:
          id: "boot-must-not-show-permission-denied"
- assertVisible:
    id: "root-tab__camera_button"
- takeScreenshot: "concurrent-step0-stable-landing"
