# P19 — Form has 2 → remove 1 → + library fresh (not preserved)
appId: com.buildtrack.app.local
tags:
  - create-task-photo
  - p19
---
- evalScript: ${output.permutation = "P19"}
- runFlow: _boot-b.yaml
- runFlow: _ensure-project.yaml
- runFlow: _open-hybrid-library-no-select.yaml

- runFlow: _pick-slot-0-b.yaml
- runFlow: _pick-slot-1-b.yaml
- assertVisible: ".*2 selected.*"
- runFlow: _accept-library.yaml
- runFlow: _confirm-selection.yaml
- tapOn:
    id: "create-task__attachment_preview_remove_0"
- takeScreenshot: "ct-P19-form-one-after-remove"
- runFlow: _reopen-library-from-form.yaml
# Form-plus reopen starts fresh (selection cleared) - correct product behavior
- assertVisible: "Select photos"
- waitForAnimationToEnd:
    timeout: 1000
# Phase B: cancel hybrid library via back button
- tapOn:
    id: "app-screen-header__back"
- runFlow:
    when:
      visible:
        id: "capture-session__library_grid"
    commands:
      - tapOn:
          id: "app-screen-header__back"
      - waitForAnimationToEnd:
          timeout: 1000
- extendedWaitUntil:
    visible:
      id: "create-task__continuous_form"
    timeout: 8000
- runFlow: _submit-create-task.yaml
- takeScreenshot: "ct-P19-done"
