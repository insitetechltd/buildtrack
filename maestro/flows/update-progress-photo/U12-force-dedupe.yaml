# U12 — Dedupe identity on progress attachments (maps P22)
appId: com.buildtrack.app.local
tags:
  - update-progress-photo
  - u12
---
- evalScript: ${output.permutation = "U12"}
- runFlow: _boot.yaml
- runFlow: _ensure-project.yaml
- runFlow: _seed-task-open-update.yaml
- runFlow: _open-library.yaml
- runFlow: ../create-task-photo/_pick-first.yaml
- runFlow: _confirm-selection.yaml
- runFlow: _reopen-library-from-form.yaml
# Form-plus reopen starts fresh (selection cleared) - correct product behavior
- assertVisible: "Select photos"
- waitForAnimationToEnd:
    timeout: 1000
# Re-pick first, then accept to test dedupe
- runFlow: ../create-task-photo/_pick-first.yaml
- runFlow: ../create-task-photo/_accept-library.yaml
- assertVisible:
    id: "photo-selection__tile_0"
- assertNotVisible:
    id: "photo-selection__tile_1"
- runFlow: _confirm-selection.yaml
- runFlow: _submit-update.yaml
- takeScreenshot: "up-U12-done"
