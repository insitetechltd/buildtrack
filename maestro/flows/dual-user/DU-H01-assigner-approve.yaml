# DU-H01 phase 4 — John approves Alice's submitted task.
appId: com.buildtrack.app.local
tags:
  - dual-user
  - du-h01
---
- runFlow: _resume-john.yaml
- runFlow: _open-task-by-title.yaml
- takeScreenshot: "du-h01-10-john-review"
- runFlow:
    when:
      visible:
        id: "task-detail__quick-action-approve_task"
    commands:
      - scrollUntilVisible:
          centerElement: true
          element:
            id: "task-detail__quick-action-approve_task"
          direction: DOWN
      - assertVisible:
          id: "task-detail__quick-action-approve_task"
      - tapOn:
          id: "task-detail__quick-action-approve_task"
      - waitForAnimationToEnd:
          timeout: 4000
- assertNotVisible:
    id: "task-detail__quick-action-approve_task"
- scrollUntilVisible:
    centerElement: true
    element:
      text: ".*Approved.*"
    direction: UP
- assertVisible: ".*Approved.*"
- takeScreenshot: "du-h01-11-john-approved"
