# NOTE: Project names/seeds match Sprint7 preset A actual: 2 seeded projects. Display:
#   "Shared Harbor Tower" (id: sprint7-project-shared-harbor-tower)
#   "Tristan Private Fitout" (id: sprint7-project-tristan-private-fitout)
# Matches 2026-08-07_094247 screen-hierarchy step-019 after initialize-sandbox.
# NOTE: Project picker entry id = profile-menu-project_picker. Rows use S-UX-01I testIDs
# `project-picker__row-${projectId}` (commit 145282e ProjectPickerScreen.tsx L75).
# NOTE: SELECTOR CONTRACT — 0 text taps on project picker rows / profile trigger / dashboard.
#   Row A tap id: project-picker__row-sprint7-project-shared-harbor-tower (Flow 5 covers A;
#     Flow 4 journey-login-switch-projects covers B; combined → both row ids hit with id selectors).
#   Entry uses id: profile-menu-project_picker.  Trigger uses id: app-screen-header__profile-trigger.
#   Recovery uses id: app-screen-header__back (AppScreenHeader L10 BACK_BUTTON_TEST_ID).
#   Task title wrapper assert id: create-task__field_title--preview.
#   Task Detail header assert id: task-detail__header_title.
#   UpdateProgress screen title assert id: update-progress__screen_title.
#   UpdateProgress description assert id: update-progress__description--preview.
# NOTE: 1× PLATFORM_LIMITATION Alert OK (post-select refresh SQLSTATE 22P02) documented below.
# NOTE: Exemptions documented inline:
#   1× EXEMPT DYNAMIC TAP (row tap section): Tasks-list row tap of dynamically-created UUID task.
#     taskId not captured in evalScript. TESTID_GAPS_TODO.md row 17 pattern `tasks-screen__row_${taskId}`.
#     Structurally required. Title uses Date.now() → guaranteed unique → no drift risk.
#   4× PLATFORM_LIMITATION taps (TESTID_GAPS_TODO.md rows 21-24 — native Alert.alert chrome no RN testID):
#     a) Post-project-select refresh error: Alert "Error" → "OK" (SQLSTATE 22P02 slug→UUID mismatch).
#     b) Photo picker sheet: "Choose how you want to add photos" + button "Cancel" (photo bypass).
#     c) Progress-update success: ".*Progress update added successfully!.*" + button "OK".
# NOTE: Scope reduction 2 switches → 1 switch in this flow: SQLSTATE 22P02 during
#   fetchUserProjectAssignments invalidates cache on subsequent picker opens (YOUR PROJECTS (0)).
#   Combined with flow 4 (B row id), both row IDs are hit across the 2 journey L3 flows.
# NOTE: Starts with plain launchApp (no clearState) because sprint7-initialize-sandbox
# already signed in Manager A + reseeded. clearState:true only in flow 1 (launch-smoke).
appId: com.buildtrack.app.local
---
- evalScript: ${output.taskTitle = "QA03 Journey Create " + Math.floor(Date.now() / 1000)}
- evalScript: ${output.progressNote = "Progress bump " + Math.floor(Date.now() / 1000)}
- evalScript: ${output.projectAId = "sprint7-project-shared-harbor-tower"}
- launchApp:
    appId: "com.buildtrack.app.local"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "login-submit"
    commands:
      - tapOn:
          id: "login-emailOrPhone"
      - inputText: "john.managera@test.com"
      - tapOn:
          id: "login-password"
      - inputText: "password123"
      - tapOn:
          id: "login-submit"
      - extendedWaitUntil:
          visible:
            id: "dashboard-screen__root"
          timeout: 30000
- assertVisible:
    id: "dashboard-screen__root"

# Project switch 1: Explicitly land on Shared Harbor Tower (Project A — row id tap)
- tapOn:
    id: "app-screen-header__profile-trigger"
- extendedWaitUntil:
    visible:
      id: "profile-menu-project_picker"
    timeout: 5000
- tapOn:
    id: "profile-menu-project_picker"
- extendedWaitUntil:
    visible:
      id: "projectPicker-scroll"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "project-picker__row-sprint7-project-shared-harbor-tower"
    timeout: 8000
- tapOn:
    id: "project-picker__row-sprint7-project-shared-harbor-tower"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 12000
- runFlow:
    when:
      visible:
        id: "projectPicker-scroll"
    commands:
      # PLATFORM_LIMITATION a): SQLSTATE 22P02 refresh error native Alert OK. No RN testID.
      - tapOn:
          text: "OK"
      - extendedWaitUntil:
          visible:
            id: "projectPicker-scroll"
          timeout: 3000
      - tapOn:
          id: "app-screen-header__back"
      - extendedWaitUntil:
          visible:
            id: "dashboard-screen__root"
          timeout: 10000
- assertVisible:
    id: "dashboard-screen__root"

# Tasks tab → Create entry → Save
# NOTE: Direct root-tab__camera_button tap (floating create button in tab bar). This bypasses
# the Tasks-tab screen dependency on projectFilterStore.tasks data load, which can fail during
# Sprint7 preset SQLSTATE 22P02 slug→UUID assignment fetch (see PLATFORM_LIMITATION note a).
# The camera button is reachable from ANY tab (including dashboard) and renders into
# CreateTaskScreen stack regardless of Tasks-tab data readiness. Post-create success → back to
# Tasks list → search still works because newly created task lives in Zustand in-memory state.
- tapOn:
    id: "root-tab__camera_button"
- extendedWaitUntil:
    visible:
      id: "createTask-title"
    timeout: 8000
- assertVisible:
    id: "createTask-title"
- tapOn:
    id: "createTask-title"
- inputText: ${output.taskTitle}
# S-UX-01I gap P1: task-title wrapper View create-task__field_title--preview replaces text regex.
- assertVisible:
    id: "create-task__field_title--preview"
- tapOn:
    id: "createTask-description"
- inputText: "Created via M-QA-03 journey-projectswitch-create-taskdetail-update flow."
- tapOn:
    point: "50%, 18%"
- scrollUntilVisible:
    centerElement: true
    element:
      id: "create-task__submit-inline"
    direction: DOWN
- tapOn:
    id: "create-task__submit-inline"
- tapOn:
    id: "create-task__submit-inline"
    delay: 4000
- runFlow:
    when:
      visible:
        id: "create-task__submit-success-confirm"
    commands:
      - assertVisible:
          id: "create-task__submit-success-message"
      - tapOn:
          id: "create-task__submit-success-confirm"
- extendedWaitUntil:
    visible:
      id: "tasks-screen__task_list"
    timeout: 10000
- assertVisible:
    id: "tasks-screen__task_list"

# Tasks search → tap new task → Task Detail
# NOTE (Exempt 1× DYNAMIC TAP): task-row tap uses regex; created taskId runtime UUID not captured.
# Title uses Date.now() → guaranteed unique. TESTID_GAPS_TODO.md row 17 pattern.
- tapOn:
    id: "text-field:tasks-search__input"
- inputText: ${output.taskTitle}
- hideKeyboard
- assertVisible: ${".*" + output.taskTitle + ".*"}
- tapOn: ${".*" + output.taskTitle + ".*"}
- extendedWaitUntil:
    visible:
      id: "task-detail__bottom_action_bar"
    timeout: 10000
- assertVisible:
    id: "task-detail__bottom_action_bar"
# P1 gap C3: task-detail__header_title replaces bare text regex.
- assertVisible:
    id: "task-detail__header_title"

# Update Progress
- tapOn:
    id: "task-detail__quick-action-update_progress"
- extendedWaitUntil:
    visible:
      id: "update-progress__submit"
    timeout: 6000
# P1 gap row 19: update-progress__screen_title replaces header text regex.
- assertVisible:
    id: "update-progress__screen_title"
- tapOn:
    id: "update-progress__description"
- inputText: ${output.progressNote}
# P1 gap row 20: update-progress__description--preview wrapper replaces description regex.
- assertVisible:
    id: "update-progress__description--preview"
- hideKeyboard
- scrollUntilVisible:
    centerElement: true
    element:
      id: "update-progress__submit"
    direction: DOWN
- tapOn:
    id: "update-progress__submit"
# PLATFORM_LIMITATION b): Photo picker native Alert body + Cancel. No RN testID. Bypass upload path.
- runFlow:
    when:
      visible: "Choose how you want to add photos"
    commands:
      - tapOn: "Cancel"
      - assertVisible:
          id: "update-progress__submit"
      - tapOn:
          id: "update-progress__submit"
# PLATFORM_LIMITATION c): Progress-update success body + OK native Alert chrome.
- extendedWaitUntil:
    visible: ".*Progress update added successfully!.*"
    timeout: 8000
- assertVisible: ".*Progress update added successfully!.*"
- tapOn: "OK"
- extendedWaitUntil:
    visible:
      id: "task-detail__bottom_action_bar"
    timeout: 8000
- assertVisible:
    id: "task-detail__bottom_action_bar"
