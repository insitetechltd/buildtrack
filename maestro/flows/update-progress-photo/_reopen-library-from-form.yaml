appId: com.buildtrack.app.local
---
- scrollUntilVisible:
    centerElement: true
    element:
      id: "update-progress__take_photo"
    direction: UP
- tapOn:
    id: "update-progress__take_photo"
- tapOn: "Choose from Library"
- extendedWaitUntil:
    visible:
      id: "capture-session__hybrid_library"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "capture-session__library_grid"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 1500
