# P06 — Add more → Cancel library → still 1
appId: com.buildtrack.app.local
tags:
  - create-task-photo
  - p06
---
- evalScript: ${output.permutation = "P06"}
- runFlow: _boot.yaml
- runFlow: _ensure-project.yaml
- runFlow: _open-hybrid-library-no-select.yaml

- runFlow: _pick-first.yaml
- runFlow: _reopen-library-from-selection.yaml
- runFlow: _assert-prior-selected-1.yaml
# Phase B: cancel library via back/cancel (dual-surface)
- runFlow:
    when:
      visible:
        id: "app-screen-header__back"
    commands:
      - tapOn:
          id: "app-screen-header__back"
      - waitForAnimationToEnd:
          timeout: 1000
- runFlow:
    when:
      visible:
        id: "in-app-library__cancel"
    commands:
      - tapOn:
          id: "in-app-library__cancel"
      - waitForAnimationToEnd:
          timeout: 1000
# Retry if still on library (missed press / XCTest race)
- runFlow:
    when:
      visible:
        id: "capture-session__library_grid"
    commands:
      - tapOn:
          id: "app-screen-header__back"
      - waitForAnimationToEnd:
          timeout: 1000
- runFlow:
    when:
      visible:
        id: "in-app-library__grid"
    commands:
      - tapOn:
          id: "in-app-library__cancel"
      - waitForAnimationToEnd:
          timeout: 1000
- assertVisible:
    id: "photo-selection__tile_0"
- assertVisible:
    id: "photo-selection__confirm"
- takeScreenshot: "ct-P06-still-one"
- runFlow: _confirm-selection.yaml
- runFlow: _submit-create-task.yaml
- takeScreenshot: "ct-P06-done"
