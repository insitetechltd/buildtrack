appId: com.buildtrack.app.local
---
- launchApp:
    clearState: true
- openLink:
    link: "exp+buildtrack://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081"
- runFlow:
    when:
      visible: "http://localhost:8081"
    commands:
      - tapOn: "http://localhost:8081"
      - wait: 2000
- runFlow:
    when:
      visible: 'Open in "Taskr"?'
    commands:
      - tapOn: "Open"
      - wait: 2000
- extendedWaitUntil:
    visible:
      id: "login-submit"
    timeout: 10000
- tapOn:
    id: "login-emailOrPhone"
- inputText: "john.managera@test.com"
- tapOn:
    id: "login-password"
- inputText: "password123"
- hideKeyboard
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 20000
- wait: 1000
- tapOn:
    id: "app-screen-header__profile-trigger"
- extendedWaitUntil:
    visible:
      id: "profile-menu-developer_settings"
    timeout: 5000
- tapOn:
    id: "profile-menu-developer_settings"
- extendedWaitUntil:
    visible:
      id: "developer-settings__action_initialize-sprint7-sandbox"
    timeout: 10000
- tapOn:
    id: "developer-settings__action_initialize-sprint7-sandbox"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Reset as Tristan"
- extendedWaitUntil:
    visible: "Sprint 7 Sandbox Ready"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "OK"
- wait: 800
- runFlow:
    when:
      visible:
        id: "app-screen-header__profile-trigger"
    commands:
      - back
- wait: 800
- runFlow:
    when:
      notVisible:
        id: "dashboard-screen__root"
    commands:
      - tapOn:
          id: "root-tab__activity_pressable"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 5000
- takeScreenshot:
    fileName: "qa01-d-01-dashboard-header-clear-dynisland"
- scrollUntilVisible:
    element:
      id: "dashboard-screen__queue_dashboard"
    direction: DOWN
    timeout: 8000
- takeScreenshot:
    fileName: "qa01-d-02-dashboard-3-tile-grid-above-projects"
- scrollUntilVisible:
    element:
      id: "dashboard-screen__drafts_toggle"
    direction: DOWN
    timeout: 10000
- takeScreenshot:
    fileName: "qa01-d-03-dashboard-bottom-safearea-homeindicator"
- tapOn:
    id: "root-tab__tasks_pressable"
- extendedWaitUntil:
    visible:
      id: "tasks-screen__task_list"
    timeout: 10000
- takeScreenshot:
    fileName: "qa01-d-04-tasks-search-field"
- tapOn:
    id: "text-field:tasks-search__input"
- inputText: "corridor"
- hideKeyboard
- wait: 500
- takeScreenshot:
    fileName: "qa01-d-05-tasks-search-anchored-no-jump"
- tapOn:
    id: "text-field:tasks-search__input"
- inputText: " "
- eraseText:
    numberOfCharacters: 1
- hideKeyboard
- wait: 500
- scrollUntilVisible:
    element:
      id: "tasks-screen__empty_state"
    direction: DOWN
    timeout: 8000
- scrollUntilVisible:
    element:
      id: "tasks-screen__task_list"
    direction: UP
    timeout: 8000
- takeScreenshot:
    fileName: "qa01-d-06-tasks-bottom-safearea"
- runFlow:
    when:
      visible:
        id: "app-screen-header__profile-trigger"
    commands:
      - back
- wait: 800
- runFlow:
    when:
      notVisible:
        id: "dashboard-screen__root"
    commands:
      - tapOn:
          id: "root-tab__activity_pressable"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 5000
- tapOn:
    id: "app-screen-header__profile-trigger"
- extendedWaitUntil:
    visible:
      id: "profile-menu-developer_settings"
    timeout: 5000
- tapOn:
    id: "profile-menu-developer_settings"
- extendedWaitUntil:
    visible:
      id: "developer-settings__action_initialize-sprint7-sandbox"
    timeout: 10000
- takeScreenshot:
    fileName: "qa01-d-07-devsettings-buttons-tappable"
- scrollUntilVisible:
    element:
      text: ".*Clear All Local Data.*"
    direction: DOWN
    timeout: 10000
- takeScreenshot:
    fileName: "qa01-d-08-devsettings-bottom-safearea"
