# Open library picker directly from Dashboard (no capture-first).
# Phase B: Dashboard → Camera FAB → CaptureSession → hybrid library grid.
# Leaves caller on hybrid library grid ready to select photos.
appId: com.buildtrack.app.local
---
- runFlow:
    when:
      visible: "Choose how you want to add photos"
    commands:
      - tapOn: "Cancel"
- repeat:
    times: 4
    commands:
      - tapOn:
          text: "Dismiss"
          optional: true
- runFlow:
    when:
      visible:
        id: "root-tab__camera_icon_surface"
    commands:
      - tapOn:
          id: "root-tab__camera_icon_surface"
      - waitForAnimationToEnd:
          timeout: 2500
- tapOn:
    text: "Dismiss"
    optional: true
- extendedWaitUntil:
    visible:
      id: "capture-session__camera"
    timeout: 20000
# Tap fallback "Open Library" link to open hybrid library
- runFlow:
    when:
      visible:
        id: "capture-session__open_library_fallback"
    commands:
      - tapOn:
          id: "capture-session__open_library_fallback"
# If peek is shown instead of fallback, tap it
- runFlow:
    when:
      visible:
        id: "capture-session__library_peek"
    commands:
      - tapOn:
          id: "capture-session__library_peek"
# Wait for hybrid library screen
- extendedWaitUntil:
    visible:
      id: "capture-session__hybrid_library"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "capture-session__library_grid"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 1500
