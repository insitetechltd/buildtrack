# Land Activity with at least one saved local draft (creates one in-flow).
appId: com.buildtrack.app.local
---
- runFlow: _boot.yaml
- runFlow: _ensure-project.yaml
- runFlow: ../_dismiss-blocking-overlays.yaml
- runFlow: _save-local-draft.yaml
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 20000
- extendedWaitUntil:
    notVisible: "Refreshing..."
    timeout: 30000
    optional: true
# Saved drafts sit after queues (above Recent Activity). Scroll if the week strip is tall.
- scrollUntilVisible:
    centerElement: true
    element:
      id: "dashboard-screen__drafts_toggle"
    direction: DOWN
    speed: 80
    visibilityPercentage: 40
    timeout: 25000
