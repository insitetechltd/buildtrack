appId: com.buildtrack.app.local
---
- launchApp:
    clearState: true
- openLink:
    link: "exp+buildtrack://expo-development-client/?url=http%3A%2F%2F127.0.0.1%3A8081"
- runFlow:
    when:
      visible: "http://localhost:8081"
    commands:
      - tapOn: "http://localhost:8081"
      - wait: 2000
- runFlow:
    when:
      visible: 'Open in "Taskr"?'
    commands:
      - tapOn: "Open"
      - wait: 2000
- extendedWaitUntil:
    visible:
      id: "login-submit"
    timeout: 10000
- tapOn:
    id: "login-emailOrPhone"
- inputText: "john.managera@test.com"
- tapOn:
    id: "login-password"
- inputText: "password123"
- hideKeyboard
- tapOn:
    id: "login-submit"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 20000
- wait: 1000
- tapOn:
    id: "app-screen-header__profile-trigger"
- extendedWaitUntil:
    visible:
      id: "profile-menu-developer_settings"
    timeout: 5000
- tapOn:
    id: "profile-menu-developer_settings"
- extendedWaitUntil:
    visible:
      id: "developer-settings__action_initialize-sprint7-sandbox"
    timeout: 10000
- tapOn:
    id: "developer-settings__action_initialize-sprint7-sandbox"
- waitForAnimationToEnd:
    timeout: 3000
- tapOn: "Reset as Herman"
- extendedWaitUntil:
    visible: "Sprint 7 Sandbox Ready"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 1500
- tapOn: "OK"
- wait: 800
- runFlow:
    when:
      visible:
        id: "app-screen-header__profile-trigger"
    commands:
      - back
- wait: 800
- runFlow:
    when:
      notVisible:
        id: "dashboard-screen__root"
    commands:
      - tapOn:
          id: "root-tab__activity_pressable"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 5000
- takeScreenshot:
    fileName: "qa01-c-01-herman-dashboard-only-shared-project"
- tapOn:
    id: "root-tab__tasks_pressable"
- extendedWaitUntil:
    visible:
      id: "tasks-screen__task_list"
    timeout: 10000
- takeScreenshot:
    fileName: "qa01-c-02-herman-tasks-no-penthouse"
- runFlow:
    when:
      visible:
        id: "app-screen-header__profile-trigger"
    commands:
      - back
- wait: 800
- runFlow:
    when:
      notVisible:
        id: "dashboard-screen__root"
    commands:
      - tapOn:
          id: "root-tab__activity_pressable"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 5000
- tapOn:
    id: "app-screen-header__profile-trigger"
- extendedWaitUntil:
    visible:
      id: "profile-menu-developer_settings"
    timeout: 5000
- tapOn:
    id: "profile-menu-developer_settings"
- extendedWaitUntil:
    visible:
      id: "developer-settings__action_initialize-sprint7-sandbox"
    timeout: 10000
- scrollUntilVisible:
    element:
      text: ".*Local Data Statistics.*"
    direction: DOWN
    timeout: 8000
- takeScreenshot:
    fileName: "qa01-c-03-herman-devsettings-statistics-1-project"
