appId: com.buildtrack.app.local
---
- runFlow: bootstrap-live-worker-a1.yaml
- tapOn:
    id: "root-tab__tasks_pressable"
- runFlow:
    when:
      notVisible:
        id: "tasks-screen__task_list"
    commands:
      - tapOn:
          id: "root-tab__tasks_pressable"
          delay: 3000
- assertVisible:
    id: "tasks-screen__task_list"
- tapOn:
    id: "text-field:tasks-search__input"
- inputText: "Safety Equipment Check"
- runFlow: _dismiss-keyboard.yaml
- assertVisible: ".*Safety Equipment Check.*"
- tapOn: ".*Safety Equipment Check My Queue.*IN PROGRESS"
- runFlow:
    when:
      visible:
        id: "task-detail__quick-action-accept_task"
    commands:
      - tapOn:
          id: "task-detail__quick-action-accept_task"
- assertVisible:
    id: "root-tab__camera_button"
- tapOn:
    id: "root-tab__camera_button"
- assertVisible: "Progress Update"
- tapOn:
    id: "update-progress__completion-slider"
- swipe:
    start: 10%, 57%
    end: 95%, 57%
    duration: 800
- runFlow:
    when:
      visible: "95%"
    commands:
      - swipe:
          start: 90%, 57%
          end: 99%, 57%
          duration: 300
- assertVisible: "100%"
- tapOn:
    id: "update-progress__description"
- inputText: "Completed the final site safety pass and all assigned checks are now fully complete."
- runFlow: _dismiss-keyboard.yaml
- tapOn: "Photos & Files"
- tapOn:
    id: "update-progress__completion-value"
- runFlow: _dismiss-keyboard.yaml
- tapOn:
    id: "update-progress__screen_title"
- scrollUntilVisible:
    centerElement: true
    element:
      id: "update-progress__submit"
    direction: DOWN
- tapOn:
    id: "update-progress__submit"
- tapOn:
    id: "update-progress__submit"
    delay: 1500
- assertVisible: ".*Task marked as 100% complete!.*"
- tapOn: "OK"
- runFlow:
    when:
      notVisible:
        id: "task-detail__quick-action-submit_review"
    commands:
      - swipe:
          start: 2%, 45%
          end: 80%, 45%
          duration: 400
      - assertVisible:
          id: "tasks-screen__task_list"
      - tapOn:
          id: "text-field:tasks-search__input"
      - inputText: "Safety Equipment Check"
      - runFlow: _dismiss-keyboard.yaml
      - tapOn: ".*Safety Equipment Check My Queue.*IN PROGRESS"
- assertVisible:
    id: "task-detail__quick-action-submit_review"
- tapOn:
    id: "task-detail__quick-action-submit_review"
- assertVisible:
    id: "task-detail__status_submitted_for_review"
