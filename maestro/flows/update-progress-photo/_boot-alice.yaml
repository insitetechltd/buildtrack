# Field worker ordinary boot — alice.workera1@test.com.
# No clearState. Resume if already Alice; login only if on Login.
# If this sim must switch away from another user, call ../_logout.yaml first.
appId: com.buildtrack.app.local
---
- launchApp:
    clearState: false
    permissions:
      photos: allow
      medialibrary: allow
      camera: allow
      notifications: deny
- runFlow: ../_dismiss-blocking-overlays.yaml
- runFlow:
    when:
      visible:
        id: "login-submit"
    commands:
      - tapOn:
          id: "^login-emailOrPhone$"
      - inputText: "alice.workera1@test.com"
      - tapOn:
          id: "^login-password$"
      - inputText: "password123"
      - tapOn:
          id: "login-submit"
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"
- tapOn:
    text: "Not Now"
    optional: true
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 45000
- runFlow: ../create-task-photo/_assert-no-logbox.yaml
- extendedWaitUntil:
    visible:
      id: "root-tab__camera_icon_surface"
    timeout: 10000
