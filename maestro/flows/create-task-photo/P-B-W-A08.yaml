# Headed W-A08 — Create FAB / Camera tab from Activity.
appId: com.buildtrack.app.local
tags:
  - rc-headed-b
  - w-a08
---
- runFlow: _boot-no-clear.yaml
- tapOn:
    id: "root-tab__activity"
    optional: true
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 15000
- tapOn:
    id: "root-tab__camera_button"
- extendedWaitUntil:
    visible:
      id: "create-task__continuous_form"
    timeout: 20000
- takeScreenshot: "rc-B-W-A08-camera-create"
