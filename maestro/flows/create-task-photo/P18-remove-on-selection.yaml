# P18 — Pick 2 → remove one on Select Photos → form has 1
appId: com.buildtrack.app.local
tags:
  - create-task-photo
  - p18
---
- evalScript: ${output.permutation = "P18"}
- runFlow: _boot-b.yaml
- runFlow: _ensure-project.yaml
- runFlow: _open-library.yaml

- runFlow: _pick-slot-0-b.yaml
- runFlow: _pick-slot-1-b.yaml
- assertVisible: ".*2 selected.*"
- runFlow: _accept-library.yaml
- assertVisible:
    id: "photo-selection__tile_1"
- tapOn:
    id: "photo-selection__tile_0"
- tapOn:
    id: "photo-selection__preview_remove"
- tapOn: "Remove"
- extendedWaitUntil:
    visible:
      id: "photo-selection__confirm"
    timeout: 6000
- assertVisible:
    id: "photo-selection__tile_0"
- runFlow:
    when:
      visible:
        id: "photo-selection__tile_1"
    commands:
      - assertVisible:
          id: "FAIL__P18_second_tile_should_be_gone"
- takeScreenshot: "ct-P18-one-remaining"
- runFlow: _confirm-selection.yaml
- runFlow: _submit-create-task.yaml
- takeScreenshot: "ct-P18-done"
