appId: com.buildtrack.app.local
---
- launchApp:
    clearState: true
    permissions:
      photos: allow
      medialibrary: allow
      camera: allow
      notifications: deny
- extendedWaitUntil:
    visible:
      id: "login-submit"
    timeout: 25000
- tapOn:
    id: "^login-emailOrPhone$"
- inputText: "john.managera@test.com"
- tapOn:
    id: "^login-password$"
- inputText: "password123"
- tapOn:
    text: "Done"
    optional: true
- tapOn: "Sign In"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 45000
