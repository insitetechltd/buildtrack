# P20 — Cancel library without picking — land back on Create Task form (no crash)
appId: com.buildtrack.app.local
tags:
  - create-task-photo
  - p20
---
- evalScript: ${output.permutation = "P20"}
- runFlow: _boot-b.yaml
- runFlow: _ensure-project.yaml
- runFlow: _open-hybrid-library-no-select.yaml

- takeScreenshot: "ct-P20-empty-library"
# Phase B: cancel hybrid library via back button
- tapOn:
    id: "app-screen-header__back"
- waitForAnimationToEnd:
    timeout: 1500
# Retry if still on library (missed press / XCTest race)
- runFlow:
    when:
      visible:
        id: "capture-session__library_grid"
    commands:
      - tapOn:
          id: "app-screen-header__back"
      - waitForAnimationToEnd:
          timeout: 1000
- runFlow:
    when:
      visible: "Dismiss"
    commands:
      - tapOn: "Dismiss"
- extendedWaitUntil:
    visible:
      id: "create-task__continuous_form"
    timeout: 12000
- takeScreenshot: "ct-P20-back-on-form"
- runFlow: _submit-create-task.yaml
- takeScreenshot: "ct-P20-done"
