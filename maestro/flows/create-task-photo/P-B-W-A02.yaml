# Headed W-A02 — Project summary visible on Activity.
appId: com.buildtrack.app.local
tags:
  - rc-headed-b
  - w-a02
---
- runFlow: _boot.yaml
- runFlow: _ensure-project.yaml
- runFlow: ../_dismiss-blocking-overlays.yaml
- tapOn:
    id: "root-tab__activity"
    optional: true
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__queue_dashboard"
    timeout: 25000
- extendedWaitUntil:
    notVisible: "Refreshing..."
    timeout: 20000
- assertVisible:
    id: "dashboard-screen__project_summary_section"
- takeScreenshot: "rc-B-W-A02-project-summary"
