# Land Activity and wait until Drafts In Progress exists.
# Requires env DRAFT_TITLE (unique originator in_progress seed).
# Persist writes tasks: []; wait for the post-login fetch before looking for drafts.
# Drafts are the last section on Activity (below Recent Activity) — scroll down to reach them.
appId: com.buildtrack.app.local
---
- runFlow: _boot.yaml
- runFlow: _ensure-project.yaml
- runFlow: ../_dismiss-blocking-overlays.yaml
- tapOn:
    id: "root-tab__activity"
    optional: true
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 20000
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__queue_dashboard"
    timeout: 25000
- extendedWaitUntil:
    notVisible: "Refreshing..."
    timeout: 20000
- runFlow:
    when:
      notVisible:
        id: "dashboard-screen__drafts_toggle"
    commands:
      - scrollUntilVisible:
          element:
            id: "dashboard-screen__drafts_toggle"
          direction: DOWN
          speed: 40
          visibilityPercentage: 50
          timeout: 20000
          waitToSettleTimeoutMs: 600
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__drafts_toggle"
    timeout: 8000
