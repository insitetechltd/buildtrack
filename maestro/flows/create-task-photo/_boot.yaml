# Ordinary day-to-day boot (John): no clearState.
# Resume live session when already authenticated; login only if on Login.
# Tier policy: clearState only for intentional first-install / TCC / sandbox-reset flows.
# Identity switch: use ../_logout.yaml then login — do not wipe the container.
appId: com.buildtrack.app.local
---
- launchApp:
    clearState: false
    permissions:
      photos: allow
      medialibrary: allow
      camera: allow
      notifications: deny
- runFlow: ../_dismiss-blocking-overlays.yaml
- runFlow:
    when:
      visible:
        id: "login-submit"
    commands:
      - tapOn:
          id: "^login-emailOrPhone$"
      - inputText: "john.managera@test.com"
      - tapOn:
          id: "^login-password$"
      - inputText: "password123"
      - tapOn:
          id: "login-submit"
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"
- runFlow:
    when:
      visible:
        id: "admin-overview-hero"
    commands:
      - tapOn:
          id: "root-tab__activity"
- tapOn:
    text: "Not Now"
    optional: true
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 45000
- runFlow: _assert-no-logbox.yaml
- extendedWaitUntil:
    visible:
      id: "root-tab__camera_icon_surface"
    timeout: 10000
