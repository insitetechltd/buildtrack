# Cancel hybrid library → land on Update Progress.
# Phase B: cancel from CaptureSession hybrid library back to update form.
appId: com.buildtrack.app.local
---
- tapOn:
    id: "app-screen-header__back"
- waitForAnimationToEnd:
    timeout: 2000
- runFlow:
    when:
      visible:
        id: "photo-selection__confirm"
    commands:
      - tapOn:
          id: "app-screen-header__back"
      - waitForAnimationToEnd:
          timeout: 1000
- extendedWaitUntil:
    visible:
      id: "update-progress__screen_title"
    timeout: 15000
