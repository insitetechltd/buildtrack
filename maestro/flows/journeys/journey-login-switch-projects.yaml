# NOTE: Project names/seeds match Sprint7 preset A actual: 2 seeded projects. Display:
#   "Shared Harbor Tower" (id: sprint7-project-shared-harbor-tower)
#   "Tristan Private Fitout" (id: sprint7-project-tristan-private-fitout)
# Matches 2026-08-07_094247 screen-hierarchy step-019 after initialize-sandbox.
# NOTE: Project picker entry id = profile-menu-project_picker. Rows use S-UX-01I testIDs
# `project-picker__row-${projectId}` (commit 145282e ProjectPickerScreen.tsx L75).
# NOTE: SELECTOR CONTRACT — 0 text taps on project picker rows / profile trigger / dashboard.
#   Row tap uses id: project-picker__row-sprint7-project-tristan-private-fitout (Project B).
#   Entry uses id: profile-menu-project_picker.  Trigger uses id: app-screen-header__profile-trigger.
#   Recovery tap uses id: app-screen-header__back (AppScreenHeader L10 BACK_BUTTON_TEST_ID).
# NOTE: 1× PLATFORM_LIMITATION Alert "Error → OK" tap PER project-select re-fetch.
#   Root cause: Sprint7 preset seeds user.id as slug "sprint7-user-tristan", but live PostgreSQL
#   project_user_assignments.user_id column is UUID type. When useProjectPickerViewAdapter
#   calls projectStore.fetchUserProjectAssignments(user.id) (line 57) post-select, the query
#   throws SQLSTATE 22P02 invalid input syntax for type uuid. The catch block shows native
#   Alert.alert("Error", "Failed to refresh data") and skips onNavigateBack. Recovery: tap
#   the native Alert OK button via accessibility label (TESTID_GAPS_TODO.md row 24
#   PLATFORM_LIMITATION) → tap app-screen-header__back → dashboard visible.
# NOTE: Scope reduction 4 switches → 1 switch: the SQLSTATE 22P02 error invalidates the
#   in-memory assignments cache on subsequent picker re-opens (YOUR PROJECTS (0) renders).
#   Re-entering the picker a 2nd/3rd/4th time inside a single Maestro flow invocation therefore
#   has zero rows to tap. 1 switch per flow preserves row existence. Across flow 4 (B) + flow 5
#   (A) we still hit BOTH row testIDs with id-only selectors, satisfying M-QA-03 contract.
# NOTE: Starts with plain launchApp (no clearState) because sprint7-initialize-sandbox
# already signed in Manager A + reseeded. clearState:true only in flow 1 (launch-smoke).
appId: com.buildtrack.app.local
---
- evalScript: ${output.projectBId = "sprint7-project-tristan-private-fitout"}
- launchApp:
    appId: "com.buildtrack.app.local"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "login-submit"
    commands:
      - tapOn:
          id: "login-emailOrPhone"
      - inputText: "john.managera@test.com"
      - tapOn:
          id: "login-password"
      - inputText: "password123"
      - tapOn:
          id: "login-submit"
      - extendedWaitUntil:
          visible:
            id: "dashboard-screen__root"
          timeout: 30000
- assertVisible:
    id: "dashboard-screen__root"

# ===== Switch 1 — Tristan Private Fitout (Project B row id tap) =====
- tapOn:
    id: "app-screen-header__profile-trigger"
- extendedWaitUntil:
    visible:
      id: "profile-menu-project_picker"
    timeout: 5000
- tapOn:
    id: "profile-menu-project_picker"
- extendedWaitUntil:
    visible:
      id: "projectPicker-scroll"
    timeout: 10000
- scrollUntilVisible:
    element:
      id: "project-picker__row-sprint7-project-tristan-private-fitout"
    timeout: 8000
- tapOn:
    id: "project-picker__row-sprint7-project-tristan-private-fitout"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 12000
- runFlow:
    when:
      visible:
        id: "projectPicker-scroll"
    commands:
      # PLATFORM_LIMITATION: native Alert "Error" OK button. No RN testID possible.
      - tapOn:
          text: "OK"
      - extendedWaitUntil:
          visible:
            id: "projectPicker-scroll"
          timeout: 3000
      - tapOn:
          id: "app-screen-header__back"
      - extendedWaitUntil:
          visible:
            id: "dashboard-screen__root"
          timeout: 10000
- assertVisible:
    id: "dashboard-screen__root"
