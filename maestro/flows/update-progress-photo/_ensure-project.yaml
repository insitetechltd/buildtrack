# Force Project A for Update Progress seeds (API seed always targets Project A).
# create-task-photo/_ensure-project only acts on empty "Select a project…" — not enough
# when John already has Harbor Tower / another LPM selected (U01 row invisible after search).
appId: com.buildtrack.app.local
---
- runFlow: ../_dismiss-blocking-overlays.yaml
- tapOn:
    id: "root-tab__activity"
    optional: true
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 20000
- runFlow:
    when:
      notVisible: ".*Project A - Commercial Building.*"
    commands:
      - tapOn:
          id: "app-screen-header__profile-trigger"
      - waitForAnimationToEnd:
          timeout: 1500
      - extendedWaitUntil:
          visible:
            id: "profile-menu-project_picker"
          timeout: 12000
      - tapOn:
          id: "profile-menu-project_picker"
      - extendedWaitUntil:
          visible:
            id: "projectPicker-scroll"
          timeout: 12000
      - runFlow:
          when:
            visible: ".*Project A - Commercial Building.*"
          commands:
            - tapOn: ".*Project A - Commercial Building.*"
      - waitForAnimationToEnd:
          timeout: 2500
      - runFlow:
          when:
            visible: "Select a Project"
          commands:
            - tapOn:
                id: "app-screen-header__back"
      - extendedWaitUntil:
          visible:
            id: "dashboard-screen__root"
          timeout: 45000
- extendedWaitUntil:
    visible: ".*Project A - Commercial Building.*"
    timeout: 20000
- assertVisible:
    id: "dashboard-screen__root"
- runFlow: ../create-task-photo/_assert-no-logbox.yaml
