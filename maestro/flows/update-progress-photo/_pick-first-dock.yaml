# Pick first Recents tile on capture-session hybrid grid → Select Photos tile_0.
# Phase B: tap upper-right corner checkbox to select (center tap opens fullscreen)
appId: com.buildtrack.app.local
---
- tapOn:
    point: "30%, 18%"
- waitForAnimationToEnd:
    timeout: 1000
- runFlow:
    when:
      notVisible: ".*[1-9] selected.*"
    commands:
      # Fallback: retry corner tap slightly adjusted
      - tapOn:
          point: "29%, 20%"
- extendedWaitUntil:
    visible: ".*[1-9] selected.*"
    timeout: 10000
- tapOn:
    id: "capture-session__hybrid_done"
- extendedWaitUntil:
    visible:
      id: "photo-selection__confirm"
    timeout: 25000
- assertVisible:
    id: "photo-selection__tile_0"
