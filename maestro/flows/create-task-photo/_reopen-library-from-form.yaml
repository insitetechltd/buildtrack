# From Create Task form: Add photos → Choose from Library → hybrid grid.
# Phase B: opens CaptureSession hybrid library, not legacy in-app library.
appId: com.buildtrack.app.local
---
- scrollUntilVisible:
    centerElement: true
    element:
      id: "createTask-add-photos"
    direction: DOWN
- tapOn:
    id: "createTask-add-photos"
- tapOn: "Choose from Library"
- extendedWaitUntil:
    visible:
      id: "capture-session__hybrid_library"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "capture-session__library_grid"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 1500
