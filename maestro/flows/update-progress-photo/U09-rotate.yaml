# U09 — Rotate then submit (maps P10)
appId: com.buildtrack.app.local
tags:
  - update-progress-photo
  - u09
---
- evalScript: ${output.permutation = "U09"}
- runFlow: _boot.yaml
- runFlow: _ensure-project.yaml
- runFlow: _seed-task-open-update.yaml
- runFlow: _open-library.yaml
- runFlow: ../create-task-photo/_pick-first.yaml
- tapOn:
    id: "photo-selection__tile_0"
- assertVisible:
    id: "photo-selection__preview"
- tapOn:
    id: "photo-selection__tool_rotate"
- waitForAnimationToEnd:
    timeout: 2000
- tapOn:
    id: "photo-selection__preview_confirm"
- runFlow: _confirm-selection.yaml
- runFlow: _submit-update.yaml
- takeScreenshot: "up-U09-done"
