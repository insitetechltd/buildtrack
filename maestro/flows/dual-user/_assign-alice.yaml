# Pick Alice Worker A1 as sole primary assignee on Create Task.
# Capture-first create often pre-selects the assigner as Primary; Alice must be
# primary (not Delegate) or Accept/Decline never appear for her (D01 2026-09-23).
# Chip remove/set-primary testIDs use user UUID (DEV QA seed SoT).
appId: com.buildtrack.app.local
---
- scrollUntilVisible:
    centerElement: true
    visibilityPercentage: 40
    element:
      id: "create-task__assignee-picker-trigger"
    direction: DOWN
- tapOn:
    id: "create-task__assignee-picker-trigger"
- extendedWaitUntil:
    visible: "Assign To"
    timeout: 12000
- extendedWaitUntil:
    notVisible: "Fetching project team members"
    timeout: 30000
- extendedWaitUntil:
    visible:
      id: "create-task__assignee-option-alice-workera1-at-test-com"
    timeout: 45000
- takeScreenshot: "du-assignee-picker-open"
- scrollUntilVisible:
    centerElement: true
    visibilityPercentage: 40
    element:
      id: "create-task__assignee-option-alice-workera1-at-test-com"
    direction: DOWN
    timeout: 20000
- tapOn:
    id: "create-task__assignee-option-alice-workera1-at-test-com"
- tapOn:
    id: "create-task__assignee-picker-done"
- extendedWaitUntil:
    visible:
      id: "create-task__selected_assignees"
    timeout: 12000
# Alice UUID aebc58fa… / John UUID efaf817c… — written by ensure-dual-user-project-data.
- tapOn:
    id: "create-task__set_primary_aebc58fa-1a20-40fb-b2d9-82209980733a"
    optional: true
- tapOn:
    id: "create-task__remove_assignee_efaf817c-4502-4fd0-a2f4-2723c82b52bd"
    optional: true
- extendedWaitUntil:
    visible: ".*Alice Worker A1.*Primary.*"
    timeout: 8000
- assertNotVisible: ".*John Manager A.*"
- takeScreenshot: "du-assignee-alice-selected"
