# Accept library selection → wait for Select Photos (multi-pin can be slow).
# Phase B: tap Done badge on hybrid library, then wait for photo-selection confirm.
# Keep waits tight: fail fast if pin/nav hangs rather than sit on loading for 60s+.
appId: com.buildtrack.app.local
---
- waitForAnimationToEnd:
    timeout: 800
- tapOn:
    point: "95%,10%"
- runFlow:
    when:
      visible:
        id: "capture-session__library_grid"
    commands:
      - extendedWaitUntil:
          notVisible:
            id: "capture-session__library_grid"
          timeout: 12000
# Retry accept if still on library (disabled-race / missed press)
- runFlow:
    when:
      visible: ".*selected.*"
    commands:
      - runFlow:
          when:
            visible:
              id: "capture-session__library_grid"
          commands:
            - tapOn:
                point: "95%,10%"
- extendedWaitUntil:
    visible:
      id: "photo-selection__confirm"
    timeout: 15000
- runFlow: _assert-no-logbox.yaml
