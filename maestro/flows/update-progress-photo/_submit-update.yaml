# Description + submit Update Progress; assert success alert.
appId: com.buildtrack.app.local
---
- evalScript: ${output.progressNote = "Maestro UP photo " + Date.now()}
- scrollUntilVisible:
    centerElement: true
    element:
      id: "update-progress__description"
    direction: DOWN
- tapOn:
    id: "update-progress__description"
- inputText: ${output.progressNote}
# Keyboard covers Submit. Do not use hideKeyboard. Tap chrome that is not the
# description field so XCTest is not tapping through the keyboard onto Submit.
- runFlow: ../_dismiss-keyboard.yaml
- tapOn: "Photos & Files"
- tapOn:
    id: "update-progress__completion-value"
- runFlow: ../_dismiss-keyboard.yaml
- scrollUntilVisible:
    centerElement: true
    element:
      id: "update-progress__submit"
    direction: DOWN
- runFlow:
    when:
      visible: "Done"
    commands:
      - tapOn: "Done"
      - tapOn:
          point: "50%, 8%"
      - tapOn: "Photos & Files"
      - waitForAnimationToEnd:
          timeout: 1500
- tapOn:
    id: "update-progress__submit"
- tapOn:
    id: "update-progress__submit"
    delay: 2000
- extendedWaitUntil:
    visible: ".*Progress update added successfully!.*"
    timeout: 25000
- tapOn: "OK"
- runFlow:
    when:
      visible: "OK"
    commands:
      - tapOn: "OK"
