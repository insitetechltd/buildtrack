# W-T04: Filters button opens the filter sheet; Apply leaves a status chip.
appId: com.buildtrack.app.local
tags:
  - rc-headed-d04
---
- runFlow: ../create-task-photo/_boot.yaml
- runFlow: ../create-task-photo/_ensure-project.yaml
- runFlow: ../_dismiss-blocking-overlays.yaml

- tapOn:
    id: "root-tab__tasks_pressable"
- extendedWaitUntil:
    visible:
      id: "tasks-screen__root"
    timeout: 25000
- extendedWaitUntil:
    visible:
      id: "tasks-screen__task_list"
    timeout: 25000
- tapOn:
    id: "tasks-screen__header_reset_filters"
    optional: true
- waitForAnimationToEnd:
    timeout: 800
- takeScreenshot: "rc-D-T04-before-filters"

- tapOn:
    id: "tasks-screen__filters_button"
- extendedWaitUntil:
    visible:
      id: "tasks-filters-sheet"
    timeout: 10000
- assertVisible:
    id: "tasks-filters-sheet__apply"
- takeScreenshot: "rc-D-T04-sheet-open"

- tapOn:
    id: "tasks-filters-sheet__status_new"
- waitForAnimationToEnd:
    timeout: 800
- takeScreenshot: "rc-D-T04-status-new"
- tapOn:
    id: "tasks-filters-sheet__apply"
- extendedWaitUntil:
    notVisible:
      id: "tasks-filters-sheet"
    timeout: 10000
- extendedWaitUntil:
    visible:
      id: "tasks-screen__active_filter_chips"
    timeout: 8000
- assertVisible:
    id: "tasks-screen__chip_remove_status"
- takeScreenshot: "rc-D-T04-applied"
