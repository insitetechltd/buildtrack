---
- runFlow: _boot-bob.yaml
- runFlow: _ensure-project.yaml
- runFlow: _open-seeded-task-detail.yaml
- scrollUntilVisible:
    centerElement: true
    element:
      id: "task-detail__quick-action-edit_task"
    direction: DOWN
- tapOn:
    id: "task-detail__quick-action-edit_task"
- extendedWaitUntil:
    visible: "Edit Task"
    timeout: 15000
- takeScreenshot: "rc-E-W-D08-edit-task"
