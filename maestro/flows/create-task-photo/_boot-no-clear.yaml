# Same login/landing as _boot.yaml but preserves simulator-local state
# (e.g. prior local drafts in AsyncStorage). Prefer _open-activity-drafts.yaml
# which creates a fresh local draft each run.
appId: com.buildtrack.app.local
---
# stopApp kills the process — logout first so Realtime channels close (M-DATA-04).
- runFlow: ../_logout.yaml
- launchApp:
    clearState: false
    stopApp: true
    permissions:
      photos: allow
      medialibrary: allow
      camera: allow
      notifications: deny
- runFlow:
    when:
      visible:
        id: "login-submit"
    commands:
      - tapOn:
          id: "^login-emailOrPhone$"
      - inputText: "john.managera@test.com"
      - tapOn:
          id: "^login-password$"
      - inputText: "password123"
      - tapOn:
          id: "login-submit"
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 45000
- runFlow: _assert-no-logbox.yaml
- extendedWaitUntil:
    visible:
      id: "root-tab__camera_icon_surface"
    timeout: 10000

