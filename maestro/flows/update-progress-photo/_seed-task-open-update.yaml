# Open API-seeded task → Task Detail with progress dock visible.
# Prerequisite: scripts/maestro/ensure-update-progress-seed-task.cjs
# Runner must pass -e UP_SEED_TITLE=... and UP_SEED_TASK_ID=...
# Product SoT (2026-09): Task Detail dock — root camera FAB is hidden here.
appId: com.buildtrack.app.local
---
- runFlow:
    when:
      visible: "Choose how you want to add photos"
    commands:
      - tapOn: "Cancel"
- repeat:
    times: 4
    commands:
      - tapOn:
          text: "Dismiss"
          optional: true
- tapOn:
    id: "root-tab__tasks_pressable"
- extendedWaitUntil:
    visible:
      id: "tasks-screen__root"
    timeout: 25000
- runFlow:
    when:
      notVisible:
        id: "tasks-screen__task_list"
    commands:
      - tapOn:
          id: "root-tab__tasks_pressable"
          delay: 2000
- extendedWaitUntil:
    visible:
      id: "tasks-screen__task_list"
    timeout: 25000
- runFlow:
    when:
      visible:
        id: "tasks-screen__header_reset_filters"
    commands:
      - tapOn:
          id: "tasks-screen__header_reset_filters"
      - waitForAnimationToEnd:
          timeout: 3000
# Always eraseText first — iOS TextInput appends without clear.
- tapOn:
    id: "text-field:tasks-search__input"
- eraseText
- inputText: ${UP_SEED_TITLE}
- tapOn:
    point: "50%, 8%"
- waitForAnimationToEnd:
    timeout: 800
- runFlow:
    when:
      visible:
        id: "tasks-screen__root"
    commands:
      - runFlow:
          when:
            notVisible:
              id: ${"tasks-screen__row_" + UP_SEED_TASK_ID}
          commands:
            - runFlow:
                when:
                  visible:
                    id: "tasks-screen__header_reset_filters"
                commands:
                  - tapOn:
                      id: "tasks-screen__header_reset_filters"
                  - waitForAnimationToEnd:
                      timeout: 3000
            - tapOn:
                id: "text-field:tasks-search__input"
            - eraseText
            - inputText: ${UP_SEED_TITLE}
            - tapOn:
                point: "50%, 8%"
            - waitForAnimationToEnd:
                timeout: 800
      - extendedWaitUntil:
          visible:
            id: ${"tasks-screen__row_" + UP_SEED_TASK_ID}
          timeout: 25000
      - scrollUntilVisible:
          centerElement: true
          element:
            id: ${"tasks-screen__row_" + UP_SEED_TASK_ID}
          direction: DOWN
          timeout: 10000
      - tapOn:
          id: ${"tasks-screen__row_" + UP_SEED_TASK_ID}
      - tapOn:
          id: ${"tasks-screen__row_" + UP_SEED_TASK_ID}
          delay: 800
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible:
      id: "task-detail__header_title"
    timeout: 20000
- runFlow:
    when:
      visible:
        id: "task-detail__quick-action-accept_task"
    commands:
      - tapOn:
          id: "task-detail__quick-action-accept_task"
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible:
      id: "report-reply-composer__photo"
    timeout: 12000
