# Open API-seeded task → Task Detail → Update Progress.
# Prerequisite: scripts/maestro/ensure-update-progress-seed-task.cjs
# Runner must pass -e UP_SEED_TITLE=... (and optionally UP_SEED_TASK_ID).
appId: com.buildtrack.app.local
---
- runFlow:
    when:
      visible: "Choose how you want to add photos"
    commands:
      - tapOn: "Cancel"
- repeat:
    times: 4
    commands:
      - tapOn:
          text: "Dismiss"
          optional: true
# Land on Tasks (search works from list)
- tapOn:
    id: "root-tab__tasks_pressable"
- extendedWaitUntil:
    visible:
      id: "tasks-screen__root"
    timeout: 25000
- runFlow:
    when:
      notVisible:
        id: "tasks-screen__task_list"
    commands:
      - tapOn:
          id: "root-tab__tasks_pressable"
          delay: 2000
- extendedWaitUntil:
    visible:
      id: "tasks-screen__task_list"
    timeout: 25000
# Sync API-seeded task into local store before search.
- tapOn:
    id: "tasks-screen__header_reset_filters"
- waitForAnimationToEnd:
    timeout: 3000
# Pull-ish: search once, then open the seeded row by testID (not text index).
# Do not erase+retype — iOS concatenates leftover search text.
- tapOn:
    id: "text-field:tasks-search__input"
- inputText: ${UP_SEED_TITLE}
- tapOn:
    point: "50%, 8%"
- waitForAnimationToEnd:
    timeout: 800
- runFlow:
    when:
      visible:
        id: "tasks-screen__root"
    commands:
      - runFlow:
          when:
            notVisible:
              id: ${"tasks-screen__row_" + UP_SEED_TASK_ID}
          commands:
            - tapOn:
                id: "tasks-screen__header_reset_filters"
            - waitForAnimationToEnd:
                timeout: 3000
            - tapOn:
                id: "text-field:tasks-search__input"
            - inputText: ${UP_SEED_TITLE}
            - tapOn:
                point: "50%, 8%"
            - waitForAnimationToEnd:
                timeout: 800
      - extendedWaitUntil:
          visible:
            id: ${"tasks-screen__row_" + UP_SEED_TASK_ID}
          timeout: 25000
      - scrollUntilVisible:
          centerElement: true
          element:
            id: ${"tasks-screen__row_" + UP_SEED_TASK_ID}
          direction: DOWN
          timeout: 10000
      # First tap may clear swipe-block state; second opens Task Detail.
      - tapOn:
          id: ${"tasks-screen__row_" + UP_SEED_TASK_ID}
      - tapOn:
          id: ${"tasks-screen__row_" + UP_SEED_TASK_ID}
          delay: 800
      - waitForAnimationToEnd:
          timeout: 2000
- extendedWaitUntil:
    visible:
      id: "task-detail__header_title"
    timeout: 20000
# Worker assignee may still need Accept before Update.
- runFlow:
    when:
      visible:
        id: "task-detail__quick-action-accept_task"
    commands:
      - tapOn:
          id: "task-detail__quick-action-accept_task"
      - waitForAnimationToEnd:
          timeout: 2000
# Camera-from-task-detail → Update Progress (C3)
- tapOn:
    id: "root-tab__camera_icon_surface"
- extendedWaitUntil:
    visible:
      id: "update-progress__screen_title"
    timeout: 12000
- assertVisible:
    id: "update-progress__take_photo"
