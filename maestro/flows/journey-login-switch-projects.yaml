# NOTE: Project names/seeds below match Sprint7 preset A: 2 seeded projects, display names "Shared Harbor Tower" and "Tristan Private Fitout". IDs are sprint7-project-shared-harbor-tower / sprint7-project-tristan-private-fitout (visible via screen hierarchy JSON 2026-08-07_094247 step-019).
# NOTE: Project picker entry uses profile-menu-project_picker testID. Rows use S-UX-01I testIDs `project-picker__row-${projectId}` (commit 145282e). 4 switches use alternating ids between the 2 seeded projects.
# NOTE: PLATFORM_LIMITATION exemptions: 0 Alert.alert taps in this flow — ALL 4 taps use id-based project-picker row IDs + profile-menu-project_picker + login/dashboard/tab ids. 0 text taps.
# NOTE: Starts with plain launchApp (no bootstrap / clearState) because sprint7-initialize-sandbox flow (executed earlier in the D7 suite) already signed in Manager A and reseeded. Keeping clearState:true ONLY in the first bootstrap flow of a session avoids repeated reinstall-clears breaking iOS dev-client routing between flows in the same Maestro suite.
appId: com.buildtrack.app.local
---
- evalScript: ${output.projectA = "Shared Harbor Tower"}
- evalScript: ${output.projectB = "Tristan Private Fitout"}
- evalScript: ${output.projectADefault = "Shared Harbor Tower"}
- evalScript: ${output.projectAId = "sprint7-project-shared-harbor-tower"}
- evalScript: ${output.projectBId = "sprint7-project-tristan-private-fitout"}
- evalScript: ${output.projectADefaultId = "sprint7-project-shared-harbor-tower"}
- launchApp:
    appId: "com.buildtrack.app.local"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "login-submit"
    commands:
      - tapOn:
          id: "login-emailOrPhone"
      - inputText: "john.managera@test.com"
      - tapOn:
          id: "login-password"
      - inputText: "password123"
      - tapOn:
          id: "login-submit"
      - extendedWaitUntil:
          visible:
            id: "dashboard-screen__root"
          timeout: 30000
- assertVisible:
    id: "dashboard-screen__root"
- tapOn:
    id: "app-screen-header__profile-trigger"
- extendedWaitUntil:
    visible:
      id: "profile-menu-project_picker"
    timeout: 5000
- tapOn:
    id: "profile-menu-project_picker"
- extendedWaitUntil:
    visible:
      id: "projectPicker-scroll"
    timeout: 10000
# Switch 1 (to A / default)
- tapOn:
    id: "project-picker__row-sprint7-project-shared-harbor-tower"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 20000
- assertVisible:
    id: "dashboard-screen__root"

# Switch 2: Project B (Tristan Private Fitout)
- tapOn:
    id: "app-screen-header__profile-trigger"
- extendedWaitUntil:
    visible:
      id: "profile-menu-project_picker"
    timeout: 5000
- tapOn:
    id: "profile-menu-project_picker"
- extendedWaitUntil:
    visible:
      id: "projectPicker-scroll"
    timeout: 10000
- tapOn:
    id: "project-picker__row-sprint7-project-tristan-private-fitout"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 20000
- assertVisible:
    id: "dashboard-screen__root"

# Switch 3: Project A (back to Shared Harbor Tower)
- tapOn:
    id: "app-screen-header__profile-trigger"
- extendedWaitUntil:
    visible:
      id: "profile-menu-project_picker"
    timeout: 5000
- tapOn:
    id: "profile-menu-project_picker"
- extendedWaitUntil:
    visible:
      id: "projectPicker-scroll"
    timeout: 10000
- tapOn:
    id: "project-picker__row-sprint7-project-shared-harbor-tower"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 20000
- assertVisible:
    id: "dashboard-screen__root"

# Switch 4: Back to Project B (proves alternating routing works; Sprint7 preset A has 2 seeded projects so 4 switches = A→B→A→B pattern)
- tapOn:
    id: "app-screen-header__profile-trigger"
- extendedWaitUntil:
    visible:
      id: "profile-menu-project_picker"
    timeout: 5000
- tapOn:
    id: "profile-menu-project_picker"
- extendedWaitUntil:
    visible:
      id: "projectPicker-scroll"
    timeout: 10000
- tapOn:
    id: "project-picker__row-sprint7-project-tristan-private-fitout"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 20000
- assertVisible:
    id: "dashboard-screen__root"
