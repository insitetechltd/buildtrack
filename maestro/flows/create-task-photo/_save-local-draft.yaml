# Create Task → fill title → Save draft → land on Activity (Saved drafts).
# Sets output.draftTitle for downstream draft-item taps.
appId: com.buildtrack.app.local
---
- evalScript: ${output.draftTitle = "Maestro draft " + Date.now()}
- tapOn:
    id: "root-tab__camera_icon_surface"
- extendedWaitUntil:
    visible:
      id: "create-task__continuous_form"
    timeout: 20000
- scrollUntilVisible:
    centerElement: true
    element:
      id: "createTask-title"
    direction: UP
    timeout: 20000
- tapOn:
    id: "createTask-title"
- inputText: ${output.draftTitle}
# Blur title so React state commits before Save draft reads formData.title.
- tapOn:
    id: "createTask-description"
- runFlow: ../_dismiss-keyboard.yaml
- scrollUntilVisible:
    centerElement: true
    element:
      id: "create-task__action_bar"
    direction: DOWN
    speed: 40
    visibilityPercentage: 100
    timeout: 25000
- scrollUntilVisible:
    centerElement: true
    element:
      id: "create-task__save-draft"
    direction: DOWN
    speed: 40
    visibilityPercentage: 100
    timeout: 25000
- waitForAnimationToEnd:
    timeout: 1500
- tapOn:
    text: "Save draft"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 45000
