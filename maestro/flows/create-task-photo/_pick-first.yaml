# Pick first (slot 0) → accept → Create Task form (capture-first skips Select Photos).
# Phase B: _pick-slot-0 uses corner tap; fallback also uses corner.
appId: com.buildtrack.app.local
---
- runFlow: _pick-slot-0.yaml
- runFlow:
    when:
      notVisible: ".*1 selected.*"
    commands:
      # Fallback: retry corner tap slightly adjusted
      - tapOn:
          point: "29%, 20%"
- extendedWaitUntil:
    visible: ".*1 selected.*"
    timeout: 8000
- runFlow: _accept-library.yaml
- runFlow:
    when:
      visible:
        id: "photo-selection__tile_0"
    commands:
      - assertVisible:
          id: "photo-selection__tile_0"
- runFlow:
    when:
      notVisible:
        id: "photo-selection__tile_0"
    commands:
      - extendedWaitUntil:
          visible:
            id: "create-task__continuous_form"
          timeout: 25000
