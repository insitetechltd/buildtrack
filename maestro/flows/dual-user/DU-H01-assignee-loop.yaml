# DU-H01 phase 3 — Alice accepts, updates with photo at 100%, submits for review.
# Task Detail hides root tabs when the progress dock is up — do NOT tap camera FAB.
# Sims: dock photo → capture-session library peek (never shutter).
appId: com.buildtrack.app.local
tags:
  - dual-user
  - du-h01
---
- runFlow: _resume-alice.yaml
- runFlow: _ensure-project.yaml
- runFlow: _open-task-by-title.yaml
- takeScreenshot: "du-h01-06-alice-inbox"
- runFlow:
    when:
      visible:
        id: "task-detail__quick-action-accept_task"
    commands:
      - tapOn:
          id: "task-detail__quick-action-accept_task"
      - waitForAnimationToEnd:
          timeout: 2500
      - assertNotVisible:
          id: "task-detail__quick-action-accept_task"
      - takeScreenshot: "du-h01-07-alice-accepted"
- runFlow:
    when:
      notVisible:
        id: "task-detail__quick-action-accept_task"
    commands:
      - takeScreenshot: "du-h01-07-alice-already-accepted"
# Retry / already-submitted: Cancel-review dock means update+submit already done.
- runFlow:
    when:
      visible:
        id: "report-reply-composer__cancel_review"
    commands:
      - takeScreenshot: "du-h01-09-alice-already-awaiting-review"
- runFlow:
    when:
      notVisible:
        id: "report-reply-composer__cancel_review"
    commands:
      - extendedWaitUntil:
          visible:
            id: "report-reply-composer__photo"
          timeout: 12000
      # Library-only photo attach from dock.
      - tapOn:
          id: "report-reply-composer__photo"
      - runFlow:
          when:
            visible: "Choose from Library"
          commands:
            - tapOn: "Choose from Library"
      - runFlow:
          when:
            visible:
              id: "capture-session__camera"
          commands:
            - runFlow:
                when:
                  visible:
                    id: "capture-session__library_peek"
                commands:
                  - tapOn:
                      id: "capture-session__library_peek"
            - runFlow:
                when:
                  visible:
                    id: "capture-session__open_library_fallback"
                commands:
                  - tapOn:
                      id: "capture-session__open_library_fallback"
      - extendedWaitUntil:
          visible:
            id: "capture-session__hybrid_library"
          timeout: 20000
      - extendedWaitUntil:
          visible:
            id: "capture-session__library_grid"
          timeout: 15000
      - waitForAnimationToEnd:
          timeout: 2000
      - takeScreenshot: "du-h01-07b-alice-library"
      - tapOn:
          point: "17%, 28%"
      - waitForAnimationToEnd:
          timeout: 1000
      - runFlow:
          when:
            notVisible: ".*[1-9] selected.*"
          commands:
            - tapOn:
                point: "17%, 22%"
      - extendedWaitUntil:
          visible: ".*[1-9] selected.*"
          timeout: 10000
      - tapOn:
          id: "capture-session__hybrid_accept"
      - extendedWaitUntil:
          visible:
            id: "photo-selection__confirm"
          timeout: 25000
      - tapOn:
          id: "photo-selection__confirm"
      - extendedWaitUntil:
          visible:
            id: "report-reply-composer"
          timeout: 20000
      - takeScreenshot: "du-h01-08a-alice-dock-with-photo"
      # Photo dirt arms the trailing send chip (right). Long-press remounts
      # the % scrubber in that same trailing slot — not the left camera.
      - longPressOn:
          id: "report-reply-composer__send"
          timeout: 2000
      - waitForAnimationToEnd:
          timeout: 800
      - extendedWaitUntil:
          visible:
            id: "report-reply-composer__completion_hit"
          timeout: 4000
      # Trailing chip ~90% x (12% was the left camera / input).
      - swipe:
          start: "90%, 78%"
          end: "90%, 42%"
          duration: 800
      - waitForAnimationToEnd:
          timeout: 800
      - tapOn:
          id: "report-reply-composer__input"
      - inputText: "Dual-user gate assignee update with photo at 100%."
      - runFlow: ../_dismiss-keyboard.yaml
      - takeScreenshot: "du-h01-08-alice-updated"
      - tapOn:
          id: "report-reply-composer__send"
      - waitForAnimationToEnd:
          timeout: 4000
      - runFlow:
          when:
            visible: "OK"
          commands:
            - tapOn: "OK"
      - runFlow:
          when:
            visible: "Success"
          commands:
            - tapOn: "OK"
      - takeScreenshot: "du-h01-09-alice-submitted"
      - runFlow:
          when:
            visible:
              id: "report-reply-composer__cancel_review"
          commands:
            - takeScreenshot: "du-h01-09-alice-awaiting-review"
      - runFlow:
          when:
            visible:
              id: "task-detail__quick-action-submit_review"
          commands:
            - scrollUntilVisible:
                centerElement: true
                element:
                  id: "task-detail__quick-action-submit_review"
                direction: DOWN
            - tapOn:
                id: "task-detail__quick-action-submit_review"
            - waitForAnimationToEnd:
                timeout: 2500
            - takeScreenshot: "du-h01-09-alice-submitted-legacy"
