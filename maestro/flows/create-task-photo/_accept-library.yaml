# Accept library selection → photo-selection confirm OR direct form/composer land.
# Phase B: tap Done badge on hybrid library.
# Fast path (P09/U07 harness lag): lands directly on form with attachment_preview.
# Traditional path: lands on photo-selection__confirm first.
appId: com.buildtrack.app.local
---
- waitForAnimationToEnd:
    timeout: 800
- tapOn:
    point: "95%,10%"
- runFlow:
    when:
      visible:
        id: "capture-session__library_grid"
    commands:
      - extendedWaitUntil:
          notVisible:
            id: "capture-session__library_grid"
          timeout: 12000
# Retry accept if still on library (disabled-race / missed press)
- runFlow:
    when:
      visible: ".*selected.*"
    commands:
      - runFlow:
          when:
            visible:
              id: "capture-session__library_grid"
          commands:
            - tapOn:
                point: "95%,10%"
# Wait for either photo-selection__confirm OR form/composer land
- runFlow:
    when:
      visible:
        id: "photo-selection__confirm"
    commands:
      # Traditional path: confirm screen present
      - extendedWaitUntil:
          visible:
            id: "photo-selection__confirm"
          timeout: 3000
- runFlow:
    when:
      notVisible:
        id: "photo-selection__confirm"
    commands:
      # Fast path: already on form/composer with attachment preview
      - runFlow:
          when:
            visible:
              id: "create-task__continuous_form"
          commands:
            - extendedWaitUntil:
                visible:
                  id: "create-task__attachment_preview_0"
                timeout: 3000
      - runFlow:
          when:
            visible:
              id: "report-reply-composer"
          commands:
            - extendedWaitUntil:
                visible:
                  id: "report-reply-composer__photo"
                timeout: 3000
- runFlow: _assert-no-logbox.yaml
