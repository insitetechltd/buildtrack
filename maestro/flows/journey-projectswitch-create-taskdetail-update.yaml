# NOTE: Project names/seeds below assume Sprint7 sandbox project names. If developer re-seeded re-run with current preset after reseed: update projectA/projectB/projectC names.
# NOTE: Project picker entry uses profile-menu-project_picker testID (attached to the Pressable in ProfileMenu.tsx line 112) for reliable translation-agnostic entry. Rows inside the opened project picker screen are tapped via text regex ${output.projectA/B} — matching the proven row-tap pattern used by task-core-live flows rc=0 in M-QA-01.
# NOTE: Starts with plain launchApp (no bootstrap / clearState) because sprint7-initialize-sandbox flow (executed earlier in the D7 suite) already signed in Manager A and reseeded. Keeping clearState:true ONLY in the first bootstrap flow of a session avoids repeated reinstall-clears breaking iOS dev-client routing between flows in the same Maestro suite.
appId: com.buildtrack.app.local
---
- evalScript: ${output.taskTitle = "QA03 Journey Create " + Math.floor(Date.now() / 1000)}
- evalScript: ${output.projectA = ".*Project A.*Commercial Building.*"}
- evalScript: ${output.projectB = ".*Project B.*"}
- evalScript: ${output.progressNote = "Progress bump " + Math.floor(Date.now() / 1000)}
- launchApp:
    appId: "com.buildtrack.app.local"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "login-submit"
    commands:
      - tapOn:
          id: "login-emailOrPhone"
      - inputText: "john.managera@test.com"
      - tapOn:
          id: "login-password"
      - inputText: "password123"
      - tapOn:
          id: "login-submit"
      - extendedWaitUntil:
          visible:
            id: "dashboard-screen__root"
          timeout: 30000
- assertVisible:
    id: "dashboard-screen__root"

# Project switch 1: Explicitly land on Project A first (profile-menu-project_picker testID + project row text regex)
- tapOn:
    id: "app-screen-header__profile-trigger"
- extendedWaitUntil:
    visible:
      id: "profile-menu-project_picker"
    timeout: 5000
- tapOn:
    id: "profile-menu-project_picker"
- extendedWaitUntil:
    visible:
      id: "projectPicker-scroll"
    timeout: 10000
- tapOn: ${output.projectA}
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 20000
- assertVisible:
    id: "dashboard-screen__root"

# Project switch 2: To Project B (second switch before journey continues — matches Planner spec)
- tapOn:
    id: "app-screen-header__profile-trigger"
- extendedWaitUntil:
    visible:
      id: "profile-menu-project_picker"
    timeout: 5000
- tapOn:
    id: "profile-menu-project_picker"
- extendedWaitUntil:
    visible:
      id: "projectPicker-scroll"
    timeout: 10000
- tapOn: ${output.projectB}
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 20000
- assertVisible:
    id: "dashboard-screen__root"

# Tasks tab → Create entry → Save
- tapOn:
    id: "root-tab__tasks_pressable"
- runFlow:
    when:
      notVisible:
        id: "tasks-screen__task_list"
    commands:
      - tapOn:
          id: "root-tab__tasks_pressable"
          delay: 3000
- extendedWaitUntil:
    visible:
      id: "tasks-screen__task_list"
    timeout: 10000
- assertVisible:
    id: "tasks-screen__task_list"
- tapOn:
    id: "root-tab__camera_button"
- extendedWaitUntil:
    visible:
      id: "createTask-title"
    timeout: 8000
- assertVisible:
    id: "createTask-title"
- tapOn:
    id: "createTask-title"
- inputText: ${output.taskTitle}
- assertVisible: ${".*" + output.taskTitle + ".*"}
- tapOn:
    id: "createTask-description"
- inputText: "Created via M-QA-03 journey-projectswitch-create-taskdetail-update flow."
- tapOn:
    point: "50%, 18%"
- scrollUntilVisible:
    centerElement: true
    element:
      id: "create-task__submit-inline"
    direction: DOWN
- tapOn:
    id: "create-task__submit-inline"
- tapOn:
    id: "create-task__submit-inline"
    delay: 4000
- runFlow:
    when:
      visible:
        id: "create-task__submit-success-confirm"
    commands:
      - assertVisible:
          id: "create-task__submit-success-message"
      - tapOn:
          id: "create-task__submit-success-confirm"
- extendedWaitUntil:
    visible:
      id: "tasks-screen__task_list"
    timeout: 10000
- assertVisible:
    id: "tasks-screen__task_list"

# Tasks search → tap new task → Task Detail
- tapOn:
    id: "text-field:tasks-search__input"
- inputText: ${output.taskTitle}
- hideKeyboard
- assertVisible: ${".*" + output.taskTitle + ".*"}
- tapOn: ${".*" + output.taskTitle + ".*"}
- extendedWaitUntil:
    visible:
      id: "task-detail__bottom_action_bar"
    timeout: 10000
- assertVisible:
    id: "task-detail__bottom_action_bar"
- assertVisible: ${".*" + output.taskTitle + ".*"}

# Update Progress flow
- tapOn:
    id: "task-detail__quick-action-update_progress"
- extendedWaitUntil:
    visible:
      id: "update-progress__submit"
    timeout: 6000
- assertVisible: "Progress Update"
- tapOn:
    id: "update-progress__description"
- inputText: ${output.progressNote}
- assertVisible: ${".*" + output.progressNote + ".*"}
- hideKeyboard
- scrollUntilVisible:
    centerElement: true
    element:
      id: "update-progress__submit"
    direction: DOWN
- tapOn:
    id: "update-progress__submit"
- runFlow:
    when:
      visible: "Choose how you want to add photos"
    commands:
      - tapOn: "Cancel"
      - assertVisible:
          id: "update-progress__submit"
      - tapOn:
          id: "update-progress__submit"
- extendedWaitUntil:
    visible: ".*Progress update added successfully!.*"
    timeout: 8000
- assertVisible: ".*Progress update added successfully!.*"
- tapOn: "OK"
- extendedWaitUntil:
    visible:
      id: "task-detail__bottom_action_bar"
    timeout: 8000
- assertVisible:
    id: "task-detail__bottom_action_bar"
