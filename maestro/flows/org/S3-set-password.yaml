# D5 S3 — Set Password after invite handoff (link opened by run-org-ca.sh).
# Invitee has no project UPA by seed design → lands on Select a Project, not Activity.
# SoT: invite link → session → set-password → set password → relogin.
appId: com.buildtrack.app.local
---
- runFlow: ../_dismiss-blocking-overlays.yaml
- extendedWaitUntil:
    visible:
      id: "set-password-screen"
    timeout: 60000
- takeScreenshot: "S3-set-password-screen"
- tapOn:
    id: "set-password-password"
- inputText: "password123"
- tapOn:
    id: "set-password-confirm"
- inputText: "password123"
- tapOn:
    id: "set-password-submit"
- extendedWaitUntil:
    notVisible:
      id: "set-password-screen"
    timeout: 60000
- takeScreenshot: "S3-after-set-password"
# Relogin proves the password stuck (SoT D5).
- runFlow: ../_logout.yaml
- extendedWaitUntil:
    visible:
      id: "login-submit"
    timeout: 45000
- tapOn:
    id: "^login-emailOrPhone$"
- eraseText
- inputText: "erin.invitee@test.com"
- tapOn:
    id: "^login-password$"
- eraseText
- inputText: "password123"
- tapOn:
    id: "login-submit"
- runFlow:
    when:
      visible: "Save Password?"
    commands:
      - tapOn: "Not Now"
- tapOn:
    text: "Not Now"
    optional: true
- extendedWaitUntil:
    visible: "Select a Project"
    timeout: 60000
- assertVisible: "No projects available"
- takeScreenshot: "S3-relogin-ok"
