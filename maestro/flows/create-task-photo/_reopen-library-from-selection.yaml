# From Select Photos: Add more → Choose from Library → hybrid grid.
# Phase B: opens CaptureSession hybrid library, not legacy in-app library.
appId: com.buildtrack.app.local
---
- assertVisible:
    id: "photo-selection__add_more"
- tapOn:
    id: "photo-selection__add_more"
- tapOn: "Choose from Library"
- extendedWaitUntil:
    visible:
      id: "capture-session__hybrid_library"
    timeout: 15000
- extendedWaitUntil:
    visible:
      id: "capture-session__library_grid"
    timeout: 15000
- waitForAnimationToEnd:
    timeout: 1500
