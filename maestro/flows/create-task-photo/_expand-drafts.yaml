# Expand Drafts In Progress (starts collapsed; last section on Activity).
# Prefer tapping "Show" — Pressable id taps were completing without expanding.
appId: com.buildtrack.app.local
---
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__drafts_toggle"
    timeout: 10000
- extendedWaitUntil:
    visible: "Show"
    timeout: 5000
- tapOn: "Show"
- waitForAnimationToEnd:
    timeout: 1500
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__drafts_list"
    timeout: 10000
