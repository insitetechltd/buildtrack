# DU-H01 phase 4 — John Accepts Alice's submitted task (PM completion accept).
# Dock SoT: report-reply-composer__approve ("Accept"). Legacy quick-action kept as fallback.
appId: com.buildtrack.app.local
tags:
  - dual-user
  - du-h01
---
- runFlow: _resume-john.yaml
- runFlow: _open-task-by-title.yaml
- takeScreenshot: "du-h01-10-john-review"
- runFlow:
    when:
      visible:
        id: "report-reply-composer__approve"
    commands:
      - assertVisible:
          id: "report-reply-composer__approve"
      - tapOn:
          id: "report-reply-composer__approve"
      - waitForAnimationToEnd:
          timeout: 4000
- runFlow:
    when:
      visible:
        id: "task-detail__quick-action-approve_task"
    commands:
      - scrollUntilVisible:
          centerElement: true
          element:
            id: "task-detail__quick-action-approve_task"
          direction: DOWN
      - tapOn:
          id: "task-detail__quick-action-approve_task"
      - waitForAnimationToEnd:
          timeout: 4000
- assertNotVisible:
    id: "report-reply-composer__approve"
- assertNotVisible:
    id: "task-detail__quick-action-approve_task"
# Post-approve SoT: Archive dock/chip appears. Avoid brittle "Approved" text scroll
# (status chip text is often not a single accessibility node after NEW schema cutover).
- runFlow:
    when:
      visible:
        id: "report-reply-composer__archive"
    commands:
      - assertVisible:
          id: "report-reply-composer__archive"
- runFlow:
    when:
      visible:
        id: "task-detail__quick-action-archive_task"
    commands:
      - assertVisible:
          id: "task-detail__quick-action-archive_task"
- extendedWaitUntil:
    visible:
      id: "task-detail__status_chips"
    timeout: 8000
- takeScreenshot: "du-h01-11-john-approved"
