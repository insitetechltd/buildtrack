# NOTE: Project names/seeds below assume Sprint7 sandbox project names. If developer re-seeded re-run with current preset after reseed: update projectA/projectB/projectC names.
# NOTE: Project picker entry uses profile-menu-project_picker testID. Rows use S-UX-01I testIDs `project-picker__row-${projectId}` (commit 145282e). projectId values = project-1 (Project A) / project-2 (Project B) / project-3 (Project C) match Sprint7 seeded IDs.
# NOTE: PLATFORM_LIMITATION exemptions: 0 Alert.alert taps in this flow — ALL 4 taps use id-based project-picker row IDs + profile-menu-project_picker + login/dashboard/tab ids. 0 text taps.
# NOTE: Starts with plain launchApp (no bootstrap / clearState) because sprint7-initialize-sandbox flow (executed earlier in the D7 suite) already signed in Manager A and reseeded. Keeping clearState:true ONLY in the first bootstrap flow of a session avoids repeated reinstall-clears breaking iOS dev-client routing between flows in the same Maestro suite.
appId: com.buildtrack.app.local
---
- evalScript: ${output.projectA = "Project A"}
- evalScript: ${output.projectB = "Project B"}
- evalScript: ${output.projectC = "Project C"}
- evalScript: ${output.projectADefault = "Project A"}
- evalScript: ${output.projectAId = "project-1"}
- evalScript: ${output.projectBId = "project-2"}
- evalScript: ${output.projectCId = "project-3"}
- evalScript: ${output.projectADefaultId = "project-1"}
- launchApp:
    appId: "com.buildtrack.app.local"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 60000
- runFlow:
    when:
      visible:
        id: "login-submit"
    commands:
      - tapOn:
          id: "login-emailOrPhone"
      - inputText: "john.managera@test.com"
      - tapOn:
          id: "login-password"
      - inputText: "password123"
      - tapOn:
          id: "login-submit"
      - extendedWaitUntil:
          visible:
            id: "dashboard-screen__root"
          timeout: 30000
- assertVisible:
    id: "dashboard-screen__root"
- tapOn:
    id: "app-screen-header__profile-trigger"
- extendedWaitUntil:
    visible:
      id: "profile-menu-project_picker"
    timeout: 5000
- tapOn:
    id: "profile-menu-project_picker"
- extendedWaitUntil:
    visible:
      id: "projectPicker-scroll"
    timeout: 10000
- tapOn:
    id: "project-picker__row-project-1"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 20000
- assertVisible:
    id: "dashboard-screen__root"

# Switch 2: Project B
- tapOn:
    id: "app-screen-header__profile-trigger"
- extendedWaitUntil:
    visible:
      id: "profile-menu-project_picker"
    timeout: 5000
- tapOn:
    id: "profile-menu-project_picker"
- extendedWaitUntil:
    visible:
      id: "projectPicker-scroll"
    timeout: 10000
- tapOn:
    id: "project-picker__row-project-2"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 20000
- assertVisible:
    id: "dashboard-screen__root"

# Switch 3: Project C
- tapOn:
    id: "app-screen-header__profile-trigger"
- extendedWaitUntil:
    visible:
      id: "profile-menu-project_picker"
    timeout: 5000
- tapOn:
    id: "profile-menu-project_picker"
- extendedWaitUntil:
    visible:
      id: "projectPicker-scroll"
    timeout: 10000
- tapOn:
    id: "project-picker__row-project-3"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 20000
- assertVisible:
    id: "dashboard-screen__root"

# Switch 4: Back to Project A (default)
- tapOn:
    id: "app-screen-header__profile-trigger"
- extendedWaitUntil:
    visible:
      id: "profile-menu-project_picker"
    timeout: 5000
- tapOn:
    id: "profile-menu-project_picker"
- extendedWaitUntil:
    visible:
      id: "projectPicker-scroll"
    timeout: 10000
- tapOn:
    id: "project-picker__row-project-1"
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 20000
- assertVisible:
    id: "dashboard-screen__root"
