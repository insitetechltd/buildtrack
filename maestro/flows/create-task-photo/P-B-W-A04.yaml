# Headed W-A04 — Activity row → Task Detail.
# Prefer no-clear so the visible Project A session stays selected.
appId: com.buildtrack.app.local
tags:
  - rc-headed-b
  - w-a04
---
- runFlow: _boot-no-clear.yaml
- tapOn:
    id: "root-tab__activity"
    optional: true
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__root"
    timeout: 20000

# Persist writes tasks: []. Wait for refetch, then tap the row title (not meta text).
- extendedWaitUntil:
    visible: "Due this week"
    timeout: 25000
- tapOn:
    id: "dashboard-screen__critical_task_.*:title-pressable"

- extendedWaitUntil:
    visible:
      id: "task-detail__header_title"
    timeout: 20000
- assertVisible:
    id: "task-detail__info_card"
- takeScreenshot: "rc-B-W-A04-task-detail"
