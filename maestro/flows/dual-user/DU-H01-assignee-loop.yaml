# DU-H01 phase 3 — Alice accepts, updates with photo, submits for review.
#
# Optimal path:
#   1. resume Alice stopApp:false   REQUIRED
#   2. ensure Project A             REQUIRED
#   3. open task (Tasks pull OK)    REQUIRED
#   4. accept if CTA visible        COMPLETE or already-accepted branch
#   5. update 100% + photo          REQUIRED
#   6. submit_review (scroll+tap)   REQUIRED — never soft-skip as "already submitted"
appId: com.buildtrack.app.local
tags:
  - dual-user
  - du-h01
---
- runFlow: _resume-alice.yaml
- runFlow: _ensure-project.yaml
- runFlow: _open-task-by-title.yaml
- takeScreenshot: "du-h01-06-alice-inbox"
- runFlow:
    when:
      visible:
        id: "task-detail__quick-action-accept_task"
    commands:
      - tapOn:
          id: "task-detail__quick-action-accept_task"
      - waitForAnimationToEnd:
          timeout: 2500
      - assertNotVisible:
          id: "task-detail__quick-action-accept_task"
      - takeScreenshot: "du-h01-07-alice-accepted"
- runFlow:
    when:
      notVisible:
        id: "task-detail__quick-action-accept_task"
    commands:
      # Retries can re-open an already-accepted task; in that case the accept CTA is absent.
      - takeScreenshot: "du-h01-07-alice-already-accepted"
- tapOn:
    id: "root-tab__camera_icon_surface"
- extendedWaitUntil:
    visible:
      id: "update-progress__screen_title"
    timeout: 12000
- runFlow: ../update-progress-photo/_open-library.yaml
- runFlow: ../create-task-photo/_pick-first.yaml
- runFlow: ../update-progress-photo/_confirm-selection.yaml
- scrollUntilVisible:
    centerElement: true
    element:
      id: "update-progress__completion-preset-100"
    direction: DOWN
- tapOn:
    id: "update-progress__completion-preset-100"
- tapOn:
    id: "update-progress__description"
- inputText: "Dual-user gate assignee update with photo at 100%."
- runFlow: ../_dismiss-keyboard.yaml
- tapOn: "Photos & Files"
- runFlow: ../_dismiss-keyboard.yaml
- scrollUntilVisible:
    centerElement: true
    element:
      id: "update-progress__submit"
    direction: DOWN
- tapOn:
    id: "update-progress__submit"
- tapOn:
    id: "update-progress__submit"
    delay: 1500
- runFlow:
    when:
      visible: "Success"
    commands:
      - tapOn:
          text: "OK"
- runFlow:
    when:
      visible: ".*Progress update added successfully!.*"
    commands:
      - tapOn: "OK"
- runFlow:
    when:
      visible:
        id: "update-progress__screen_title"
    commands:
      - tapOn:
          id: "app-screen-header__back"
- runFlow:
    when:
      notVisible:
        id: "task-detail__header_title"
    commands:
      - runFlow: _open-task-by-title.yaml
- extendedWaitUntil:
    visible:
      id: "task-detail__header_title"
    timeout: 15000
- takeScreenshot: "du-h01-08-alice-updated"
# Submit for Review can sit below the fold; do not treat "not visible yet" as already submitted.
- scrollUntilVisible:
    centerElement: true
    element:
      id: "task-detail__quick-action-submit_review"
    direction: DOWN
    speed: 40
    visibilityPercentage: 40
    timeout: 20000
- tapOn:
    id: "task-detail__quick-action-submit_review"
- waitForAnimationToEnd:
    timeout: 2500
- extendedWaitUntil:
    notVisible:
      id: "task-detail__quick-action-submit_review"
    timeout: 15000
- takeScreenshot: "du-h01-09-alice-submitted"
