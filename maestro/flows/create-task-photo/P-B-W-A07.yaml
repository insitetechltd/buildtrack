# Headed W-A07 — Swipe-delete draft (Alert is native chrome).
# Use DRAFT_TASK_ID so title+subtitle a11y merge and Recent Activity text do not flake.
appId: com.buildtrack.app.local
tags:
  - rc-headed-b
  - w-a07
---
- runFlow: _open-activity-drafts.yaml
- runFlow: _expand-drafts.yaml
- extendedWaitUntil:
    visible:
      id: "dashboard-screen__draft_item_${DRAFT_TASK_ID}"
    timeout: 8000
- swipe:
    from:
      id: "dashboard-screen__draft_item_${DRAFT_TASK_ID}"
    direction: LEFT
    duration: 500
- tapOn:
    id: "dashboard-screen__draft_item_${DRAFT_TASK_ID}:delete-action"
- extendedWaitUntil:
    visible: "Delete"
    timeout: 8000
- tapOn: "Delete"
- extendedWaitUntil:
    notVisible:
      id: "dashboard-screen__draft_item_${DRAFT_TASK_ID}"
    timeout: 15000
- takeScreenshot: "rc-B-W-A07-swipe-delete"
